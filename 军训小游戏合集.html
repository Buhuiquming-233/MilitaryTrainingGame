 \"fb-line good\";\n            MTG.sfx(\"good\");\n            updateHud();\n            window.setTimeout(function () {\n              lock = false;\n              if (state === \"run\") newRound(\"\", \"\");\n            }, 1150);\n          }\n        } else {\n          handleMistake(\"✗ 打错了（应为 \" + MOVE_NAMES[expected] + \"）\", true);\n        }\n      }\n\n      function handleMistake(message, shakeTiles) {\n        if (state !== \"run\" || lock) return;\n        lock = true;\n        badSteps += 1;\n        combo = 0;\n        updateHud();\n        fbEl.textContent = message + \"，换一套新招式\";\n        fbEl.className = \"fb-line bad\";\n        MTG.sfx(\"bad\");\n        if (shakeTiles && rowEl.children[seqIndex]) {\n          var tile = rowEl.children[seqIndex];\n          tile.classList.add(\"wrong\");\n        }\n        window.setTimeout(function () {\n          lock = false;\n          if (state === \"run\") newRound(\"\", \"\");\n        }, 650);\n      }\n\n      function endGame() {\n        state = \"over\";\n        clearInterval(timerId);\n        timerId = null;\n        var total = goodSteps + badSteps;\n        var acc = total > 0 ? Math.round(goodSteps / total * 100) : 0;\n        document.getElementById(\"resultScore\").textContent = score;\n        document.getElementById(\"resultCombo\").textContent = bestCombo;\n        document.getElementById(\"resultSets\").textContent = setsDone;\n        document.getElementById(\"resultAcc\").textContent = acc + \"%\";\n        var icon = document.getElementById(\"resultIcon\");\n        var title = document.getElementById(\"resultTitle\");\n        var body = document.getElementById(\"resultBody\");\n        var pass = setsDone >= 4 && bestCombo >= 3;\n        icon.textContent = pass ? \"🏆\" : \"🥋\";\n        title.textContent = pass ? \"拳法标兵\" : \"训练结束\";\n        if (completedMoves.length > 0) {\n          var list = [];\n          for (var i = 0; i < completedMoves.length; i++) {\n            list.push(\"第 \" + (i + 1) + \" 套：\" + completedMoves[i].join(\" → \"));\n          }\n          body.innerHTML = \"<p>本局共打出 <b>\" + completedMoves.length + \"</b> 套完整招式：</p><p style='font-size:0.9rem'>\" +\n            list.join(\"<br>\") + \"</p>\";\n        } else {\n          body.textContent = pass ? \"动作标准，继续保持！\" : \"本局还没有完整打完一套。记住打错或超时连击都会中断，稳住节奏再来一次。\";\n        }\n        MTG.openModal(document.getElementById(\"resultMask\"));\n        MTG.sfx(pass ? \"win\" : \"lose\");\n      }\n\n      startBtn.addEventListener(\"click\", function () {\n        MTG.sfx(\"click\");\n        startGame();\n      });\n      window.addEventListener(\"resize\", fitSeqRow);\n      document.getElementById(\"resultRestart\").addEventListener(\"click\", function () {\n        window.location.reload();\n      });\n\n      // 方向按钮\n      var padBtns = document.querySelectorAll(\".dirpad .pad-btn\");\n      for (var i = 0; i < padBtns.length; i++) {\n        padBtns[i].addEventListener(\"pointerdown\", function (ev) {\n          ev.preventDefault();\n          MTG.sfx(\"click\");\n          handleStep(this.getAttribute(\"data-dir\"));\n        });\n      }\n\n      // 键盘\n      document.addEventListener(\"keydown\", function (ev) {\n        var k = ev.key;\n        if ([\"ArrowLeft\", \"ArrowRight\", \"ArrowUp\", \"ArrowDown\", \" \"].indexOf(k) >= 0) ev.preventDefault();\n        var dir = null;\n        if (k === \"ArrowLeft\" || k === \"a\" || k === \"A\") dir = \"left\";\n        if (k === \"ArrowRight\" || k === \"d\" || k === \"D\") dir = \"right\";\n        if (k === \"ArrowDown\" || k === \"s\" || k === \"S\") dir = \"down\";\n        if (k === \"ArrowUp\" || k === \"w\" || k === \"W\") dir = \"up\";\n        if (dir) handleStep(dir);\n      });\n\n      // 滑动输入：在招式区域内判断滑动方向\n      var swipeZone = document.getElementById(\"swipeZone\");\n      var sx = 0, sy = 0, tracking = false;\n      swipeZone.addEventListener(\"pointerdown\", function (ev) {\n        sx = ev.clientX; sy = ev.clientY; tracking = true;\n        try { swipeZone.setPointerCapture(ev.pointerId); } catch (e) {}\n      });\n      swipeZone.addEventListener(\"pointermove\", function (ev) {\n        if (!tracking) return;\n        var dx = ev.clientX - sx;\n        var dy = ev.clientY - sy;\n        if (Math.abs(dx) < 28 && Math.abs(dy) < 28) return;\n        tracking = false;\n        var dir = null;\n        if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? \"right\" : \"left\";\n        else dir = dy > 0 ? \"down\" : \"up\";\n        MTG.sfx(\"click\");\n        handleStep(dir);\n      });\n      swipeZone.addEventListener(\"pointerup\", function () { tracking = false; });\n      swipeZone.addEventListener(\"pointercancel\", function () { tracking = false; });\n    })();\n  <\/script>\n<script>\n(function () {\n  \"use strict\";\n  function goHome() {\n    try { if (window.parent && window.parent !== window) window.parent.postMessage({ mtgCmd: \"home\" }, \"*\"); } catch (e) {}\n  }\n  document.addEventListener(\"click\", function (ev) {\n    var n = ev.target;\n    while (n && n !== document && !(n.tagName && n.tagName.toLowerCase() === \"a\")) n = n.parentNode;\n    if (n && n.getAttribute && /(^|\\/)index\\.html(#.*)?$/i.test(n.getAttribute(\"href\") || \"\")) {\n      ev.preventDefault(); ev.stopPropagation(); goHome();\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n",
  "grenade": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n  <title>手雷抛物线 - 军训小游戏</title>\n  <style>\n:root {\n  --green-900: #27360f;\n  --green-700: #3c4f1c;\n  --green-600: #4f6528;\n  --green-500: #6b8337;\n  --green-300: #a8b878;\n  --sand-300: #e7d9b4;\n  --sand-400: #d7c08d;\n  --cream: #fbf6e9;\n  --ink: #2b2a19;\n  --danger: #a63a2b;\n  --warn: #c07f13;\n  --ok: #3f7d32;\n  --radius: 14px;\n  --shadow: 0 8px 22px rgba(30, 40, 10, 0.28);\n  --shadow-sm: 0 3px 9px rgba(30, 40, 10, 0.2);\n}\n\n* { box-sizing: border-box; }\n\nhtml, body { margin: 0; padding: 0; }\n\nbody {\n  min-height: 100vh;\n  color: var(--ink);\n  font-family: \"Microsoft YaHei\", \"PingFang SC\", \"Segoe UI\", system-ui, sans-serif;\n  background-color: #46552a;\n  background-image:\n    radial-gradient(circle at 18% 22%, rgba(107, 131, 55, 0.85) 0 48px, transparent 48px),\n    radial-gradient(circle at 72% 70%, rgba(38, 54, 15, 0.75) 0 70px, transparent 70px),\n    radial-gradient(circle at 55% 28%, rgba(137, 154, 93, 0.5) 0 46px, transparent 46px),\n    radial-gradient(circle at 30% 82%, rgba(60, 79, 28, 0.9) 0 60px, transparent 60px),\n    linear-gradient(135deg, #3f4f25 0%, #55682f 55%, #39491f 100%);\n  line-height: 1.6;\n  -webkit-tap-highlight-color: transparent;\n}\n\nbutton { font-family: inherit; }\n\n.page {\n  width: 100%;\n  max-width: 1080px;\n  margin: 0 auto;\n  padding: 12px 12px 28px;\n}\n\n/* 顶部工具条 */\n.toolbar {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 12px;\n  background: rgba(43, 59, 22, 0.92);\n  border: 2px solid rgba(231, 217, 180, 0.35);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-sm);\n  color: var(--cream);\n}\n\n.toolbar h1 {\n  flex: 1;\n  margin: 0 8px;\n  font-size: 1.2rem;\n  letter-spacing: 2px;\n  text-align: center;\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  min-width: 48px;\n  min-height: 44px;\n  padding: 9px 16px;\n  border: 0;\n  border-radius: 10px;\n  font-size: 1rem;\n  font-weight: 700;\n  color: var(--cream);\n  background: linear-gradient(180deg, var(--green-500), var(--green-700));\n  box-shadow: 0 3px 0 var(--green-900), var(--shadow-sm);\n  cursor: pointer;\n  text-decoration: none;\n  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;\n  touch-action: manipulation;\n  user-select: none;\n  -webkit-user-select: none;\n}\n\n.btn:hover { filter: brightness(1.12); }\n.btn:active {\n  transform: translateY(2px);\n  box-shadow: 0 1px 0 var(--green-900);\n}\n\n.btn.ghost {\n  color: var(--green-900);\n  background: linear-gradient(180deg, var(--sand-300), var(--sand-400));\n  box-shadow: 0 3px 0 #9b8754;\n}\n\n.btn.warn {\n  background: linear-gradient(180deg, #c98325, #9a5d12);\n  box-shadow: 0 3px 0 #5f3a0a;\n}\n\n.btn:disabled {\n  filter: grayscale(0.75);\n  opacity: 0.55;\n  cursor: not-allowed;\n  transform: none;\n}\n\n.icon-btn {\n  width: 46px;\n  height: 46px;\n  min-width: 46px;\n  min-height: 46px;\n  padding: 0;\n  font-size: 1.25rem;\n  border-radius: 50%;\n}\n\n/* 通用面板 */\n.panel {\n  margin-top: 14px;\n  padding: 14px 16px;\n  border-radius: var(--radius);\n  background: var(--cream);\n  box-shadow: var(--shadow);\n  border: 1px solid rgba(88, 73, 33, 0.25);\n}\n\n.panel h2, .panel h3 {\n  margin: 0 0 6px;\n  color: var(--green-900);\n}\n\n.panel p { margin: 6px 0; }\n\n/* 状态栏 */\n.hud {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-top: 14px;\n  justify-content: center;\n}\n\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  padding: 7px 13px;\n  border-radius: 999px;\n  background: var(--cream);\n  border: 2px solid var(--sand-400);\n  box-shadow: var(--shadow-sm);\n  font-weight: 700;\n  white-space: nowrap;\n}\n\n.chip b { color: var(--green-700); font-size: 1.05em; }\n.chip.danger b { color: var(--danger); }\n.chip.ok b { color: var(--ok); }\n\n/* 主舞台 */\n.arena {\n  margin-top: 14px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 14px;\n}\n\n.stage-box {\n  width: 100%;\n  max-width: 860px;\n  border-radius: var(--radius);\n  background: var(--cream);\n  box-shadow: var(--shadow);\n  border: 1px solid rgba(88, 73, 33, 0.25);\n  overflow: hidden;\n}\n\n/* 弹窗 */\n.modal-mask {\n  position: fixed;\n  inset: 0;\n  z-index: 90;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 18px;\n  background: rgba(18, 25, 8, 0.68);\n  backdrop-filter: blur(2px);\n}\n\n.modal-card {\n  width: 100%;\n  max-width: 460px;\n  max-height: 86vh;\n  overflow: auto;\n  padding: 22px;\n  border-radius: 18px;\n  background:\n    linear-gradient(180deg, rgba(251, 246, 233, 0.97), rgba(235, 221, 186, 0.98));\n  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);\n  border: 3px solid var(--green-600);\n  text-align: center;\n  color: var(--ink);\n}\n\n.modal-card h2 {\n  margin: 0 0 8px;\n  font-size: 1.45rem;\n  color: var(--green-900);\n}\n\n.modal-card h2.big-icon { font-size: 2.6rem; }\n.modal-body { margin: 8px 0 16px; font-size: 1.02rem; }\n.modal-actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n.modal-actions .btn { min-width: 130px; }\n\n.stat-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 8px;\n  margin: 10px 0;\n}\n.stat-grid .stat {\n  padding: 9px 6px;\n  border-radius: 10px;\n  background: rgba(216, 194, 141, 0.35);\n  border: 1px solid rgba(120, 100, 45, 0.25);\n}\n.stat .label { font-size: 0.86rem; color: #665c3c; }\n.stat .value { font-size: 1.25rem; font-weight: 800; color: var(--green-900); }\n.stat .value.danger { color: var(--danger); }\n.stat .value.ok { color: var(--ok); }\n\n/* 轻提示 */\n.toast {\n  position: fixed;\n  left: 50%;\n  top: 16%;\n  z-index: 80;\n  transform: translateX(-50%);\n  padding: 10px 20px;\n  border-radius: 999px;\n  font-size: 1.05rem;\n  font-weight: 800;\n  color: #fff;\n  background: rgba(39, 54, 15, 0.92);\n  box-shadow: var(--shadow);\n  pointer-events: none;\n  text-align: center;\n  max-width: 88vw;\n  transition: opacity 0.25s ease;\n}\n.toast.hide { opacity: 0; }\n.toast.good { background: rgba(47, 103, 36, 0.94); }\n.toast.bad { background: rgba(160, 49, 35, 0.95); }\n\n/* 方向键区 */\n.dirpad {\n  display: grid;\n  grid-template-areas:\n    \". up .\"\n    \"left down right\";\n  grid-template-columns: repeat(3, 72px);\n  grid-template-rows: repeat(2, 72px);\n  gap: 8px;\n  justify-content: center;\n  margin: 4px auto;\n}\n\n.dirpad .pad-btn {\n  min-width: 64px;\n  min-height: 64px;\n  padding: 0;\n  border-radius: 12px;\n  font-size: 1.6rem;\n  background: linear-gradient(180deg, var(--green-500), var(--green-700));\n  color: #fff;\n  box-shadow: 0 4px 0 var(--green-900), var(--shadow-sm);\n  border: 0;\n  cursor: pointer;\n  touch-action: manipulation;\n  user-select: none;\n  -webkit-user-select: none;\n}\n.dirpad .pad-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-900); }\n.pad-up { grid-area: up; }\n.pad-down { grid-area: down; }\n.pad-left { grid-area: left; }\n.pad-right { grid-area: right; }\n\n/* 操作说明 */\n.help-box {\n  margin-top: 14px;\n  font-size: 0.94rem;\n  background: var(--cream);\n  color: var(--ink);\n}\n.help-box kbd {\n  display: inline-block;\n  padding: 1px 7px;\n  border-radius: 5px;\n  background: #e8e1cb;\n  border: 1px solid #b8a976;\n  box-shadow: 0 2px 0 #b3a66f;\n  font-size: 0.9em;\n  font-weight: 700;\n}\n\n/* 首页 */\n.hero {\n  margin-top: 16px;\n  padding: 26px 18px;\n  text-align: center;\n  color: var(--cream);\n}\n.hero h1 {\n  margin: 0 0 8px;\n  font-size: clamp(1.6rem, 5vw, 2.6rem);\n  letter-spacing: 8px;\n  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);\n}\n.hero p { margin: 0; font-size: 1rem; color: var(--sand-300); }\n\n.version-tag {\n  display: inline-block;\n  margin-left: 8px;\n  padding: 2px 10px;\n  border-radius: 999px;\n  background: var(--sand-400);\n  color: var(--green-900);\n  font-size: 0.8rem;\n  letter-spacing: 0;\n  vertical-align: 6px;\n}\n\n.cards {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\n  gap: 14px;\n  margin-top: 18px;\n}\n\n.card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  min-height: 168px;\n  padding: 18px;\n  border-radius: 16px;\n  color: var(--ink);\n  text-decoration: none;\n  background:\n    linear-gradient(155deg, rgba(251, 246, 233, 0.96) 0%, rgba(231, 217, 180, 0.96) 100%);\n  border: 2px solid rgba(105, 118, 58, 0.45);\n  box-shadow: var(--shadow-sm);\n  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;\n  overflow: hidden;\n}\n.card::after {\n  content: \"\";\n  position: absolute;\n  right: -28px;\n  bottom: -28px;\n  width: 100px;\n  height: 100px;\n  border-radius: 50%;\n  background: radial-gradient(circle, rgba(107, 131, 55, 0.35), transparent 70%);\n}\n.card:hover {\n  transform: translateY(-4px);\n  border-color: var(--green-500);\n  box-shadow: var(--shadow);\n}\n.card .num {\n  position: absolute;\n  top: 10px;\n  right: 12px;\n  font-size: 1.05rem;\n  font-weight: 800;\n  color: rgba(60, 79, 28, 0.45);\n}\n.card .icon { font-size: 2.4rem; line-height: 1; }\n.card h2 { margin: 0; font-size: 1.22rem; color: var(--green-900); }\n.card p { margin: 0; font-size: 0.92rem; flex: 1; }\n.card .foot {\n  font-size: 0.8rem;\n  color: #73693f;\n  border-top: 1px dashed rgba(115, 105, 63, 0.4);\n  padding-top: 7px;\n}\n\nfooter.note {\n  margin: 22px auto 4px;\n  text-align: center;\n  color: var(--sand-300);\n  font-size: 0.88rem;\n}\n\n.hidden { display: none !important; }\n\n/* 手机窄屏适配 */\n@media (max-width: 640px) {\n  .toolbar { gap: 5px; padding: 8px; }\n  .toolbar h1 { font-size: 1rem; letter-spacing: 1px; }\n  .icon-btn { width: 46px; height: 46px; min-width: 46px; min-height: 46px; }\n  .btn { padding: 9px 11px; }\n  .dirpad { grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    transition-duration: 0.01ms !important;\n  }\n}\n\n</style>\n  <style>\n    .grenade-stage {\n      position: relative;\n      width: 100%;\n      touch-action: none;\n      cursor: crosshair;\n    }\n    .grenade-stage canvas {\n      display: block;\n      width: 100%;\n      height: auto;\n      background: #b9d5e8;\n      user-select: none;\n      -webkit-user-select: none;\n    }\n    .scene-tip {\n      position: absolute;\n      left: 10px;\n      top: 10px;\n      padding: 5px 10px;\n      border-radius: 8px;\n      background: rgba(39, 54, 15, 0.75);\n      color: #fff;\n      font-size: 0.9rem;\n      pointer-events: none;\n      max-width: 82%;\n    }\n    .aim-tip {\n      position: absolute;\n      right: 12px;\n      bottom: 12px;\n      padding: 7px 12px;\n      border-radius: 10px;\n      background: rgba(39, 54, 15, 0.8);\n      color: #fff;\n      font-size: 0.95rem;\n      font-weight: 800;\n      pointer-events: none;\n      white-space: nowrap;\n    }\n    .grenade-help .row2 {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 6px;\n      align-items: center;\n      margin-top: 6px;\n    }\n  </style>\n</head>\n<body>\n  <header class=\"toolbar\">\n    <a class=\"btn ghost\" href=\"index.html\" aria-label=\"返回主页\">← 主页</a>\n    <h1>手雷抛物线</h1>\n    <button class=\"icon-btn\" id=\"btnRestart\" type=\"button\" aria-label=\"重新开始\">↻</button>\n    <button class=\"icon-btn\" id=\"btnSound\" type=\"button\" aria-label=\"音效开关\">🔇</button>\n  </header>\n\n  <main class=\"page\">\n    <section class=\"hud\" aria-label=\"游戏状态\">\n      <span class=\"chip\">关卡 <b id=\"levelNum\">1</b> / 7</span>\n      <span class=\"chip\">剩余手雷 <b id=\"nades\">5</b></span>\n      <span class=\"chip\">本关得分 <b id=\"score\">0</b> / <span id=\"need\">24</span></span>\n      <span class=\"chip ok\" id=\"targetChip\">靶型 <b>固定靶</b></span>\n      <span class=\"chip danger\" id=\"windChip\">风力 <b>无风</b></span>\n    </section>\n\n    <section class=\"arena\">\n      <div class=\"stage-box grenade-stage\" id=\"stage\">\n        <canvas id=\"gameCanvas\" width=\"960\" height=\"520\" aria-label=\"投掷场景\"></canvas>\n        <div class=\"scene-tip\" id=\"sceneTip\">按住并拖拽瞄准，松手投掷训练手雷</div>\n        <div class=\"aim-tip hidden\" id=\"aimTip\"></div>\n      </div>\n      <p class=\"panel\" style=\"margin-top:0;padding:9px 14px;max-width:860px\">💡 按住拖拽决定方向与力度；虚线只显示弹道前 50%。碰到靶心会直接爆炸，未碰靶心则按整条路径最接近靶心的触碰点计分。</p>\n    </section>\n\n    <section class=\"panel help-box grenade-help\">\n      <h3>玩法与规则</h3>\n      <p>每关 5 枚训练手雷。按住拖拽时虚线显示弹道前 50%，右下角显示角度与力度。松手投出后，只有穿过靶心才会立刻爆炸；否则按飞行路径中距离靶心最近的那一点计分并引爆。</p>\n      <div class=\"row2\">\n        <span>计分：<b>靶心 10</b> / 内圈 8 / 中圈 6 / 外圈 4 / 边缘 2</span>\n        <span>共 7 关：前 5 关靶位逐关偏移并加大风力，第 6 关为左右移动靶，第 7 关为上下左右环绕靶。</span>\n        <span>5 枚用完未达标则本关失败，可重新挑战。</span>\n      </div>\n    </section>\n  </main>\n\n  <!-- 结果弹窗 -->\n  <div class=\"modal-mask hidden\" id=\"resultMask\">\n    <section class=\"modal-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"resultTitle\">\n      <h2 class=\"big-icon\" id=\"resultIcon\">🎯</h2>\n      <h2 id=\"resultTitle\">关卡结束</h2>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"label\">本关得分</div><div class=\"value\" id=\"resultScore\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">达标分</div><div class=\"value\" id=\"resultNeed\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">命中手雷</div><div class=\"value\" id=\"resultHits\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">剩余手雷</div><div class=\"value\" id=\"resultLeft\">0</div></div>\n      </div>\n      <div class=\"modal-body\" id=\"resultBody\"></div>\n      <div class=\"modal-actions\" id=\"resultActions\">\n        <button class=\"btn\" id=\"actionRetry\" type=\"button\">重新挑战本关</button>\n        <a class=\"btn ghost\" href=\"index.html\">返回主页</a>\n      </div>\n    </section>\n  </div>\n\n  <script>\n/* 公共辅助：音效开关、音效生成、最高分读写、通用轻提示 */\n(function () {\n  \"use strict\";\n\n  var STORAGE_KEY = \"mtg_sound_on\";\n  var soundOn = false;\n  var audioCtx = null;\n\n  // 兼容 file:// 下 localStorage 不可用的情况\n  function storageGet(key) {\n    try {\n      return window.localStorage.getItem(key);\n    } catch (e) {\n      return null;\n    }\n  }\n\n  function storageSet(key, value) {\n    try {\n      window.localStorage.setItem(key, value);\n    } catch (e) {\n      /* 忽略：隐私模式或 file:// 限制时仅本次会话有效 */\n    }\n  }\n\n  function ensureCtx() {\n    if (!audioCtx) {\n      var AC = window.AudioContext || window.webkitAudioContext;\n      if (AC) {\n        audioCtx = new AC();\n      }\n    }\n    if (audioCtx && audioCtx.state === \"suspended\") {\n      audioCtx.resume();\n    }\n    return audioCtx;\n  }\n\n  function tone(freq, dur, when, type, volume) {\n    var ctx = audioCtx;\n    if (!ctx) return;\n    var t0 = ctx.currentTime + (when || 0);\n    var osc = ctx.createOscillator();\n    var gain = ctx.createGain();\n    osc.type = type || \"square\";\n    osc.frequency.setValueAtTime(freq, t0);\n    gain.gain.setValueAtTime(0.0001, t0);\n    gain.gain.exponentialRampToValueAtTime(volume || 0.12, t0 + 0.012);\n    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n    osc.connect(gain);\n    gain.connect(ctx.destination);\n    osc.start(t0);\n    osc.stop(t0 + dur + 0.04);\n  }\n\n  function sfx(kind) {\n    if (!soundOn || !ensureCtx()) return;\n    switch (kind) {\n      case \"click\": tone(480, 0.07, 0, \"square\", 0.08); break;\n      case \"good\": tone(660, 0.08, 0); tone(880, 0.1, 0.09); break;\n      case \"bad\": tone(180, 0.22, 0, \"sawtooth\", 0.11); break;\n      case \"flip\": tone(700, 0.05, 0, \"triangle\", 0.08); break;\n      case \"tick\": tone(1000, 0.04, 0, \"square\", 0.05); break;\n      case \"win\":\n        tone(523, 0.1, 0);\n        tone(659, 0.1, 0.12);\n        tone(784, 0.18, 0.24);\n        break;\n      case \"lose\":\n        tone(392, 0.16, 0);\n        tone(311, 0.16, 0.16);\n        tone(233, 0.3, 0.32);\n        break;\n      case \"throw\": tone(300, 0.25, 0, \"sawtooth\", 0.07); break;\n      case \"boom\": tone(120, 0.32, 0, \"sawtooth\", 0.16); break;\n      case \"step\": tone(520, 0.05, 0, \"triangle\", 0.06); break;\n      default: tone(440, 0.08, 0);\n    }\n  }\n\n  function setSound(on, persist) {\n    soundOn = !!on;\n    var btn = document.getElementById(\"btnSound\");\n    if (btn) {\n      btn.textContent = soundOn ? \"🔊\" : \"🔇\";\n      btn.title = soundOn ? \"音效：开（点击关闭）\" : \"音效：关（点击开启）\";\n      btn.setAttribute(\"aria-pressed\", soundOn ? \"true\" : \"false\");\n    }\n    if (persist !== false) storageSet(STORAGE_KEY, soundOn ? \"1\" : \"0\");\n  }\n\n  function toggleSound() {\n    setSound(!soundOn);\n    if (soundOn) {\n      ensureCtx();\n      sfx(\"click\");\n    }\n    return soundOn;\n  }\n\n  function bindSoundBtn() {\n    var btn = document.getElementById(\"btnSound\");\n    if (btn) {\n      btn.addEventListener(\"click\", function (ev) {\n        ev.stopPropagation();\n        toggleSound();\n      });\n    }\n    soundOn = storageGet(STORAGE_KEY) === \"1\"; // 音效总开关，默认关闭\n    setSound(soundOn, false);\n  }\n\n  function getScore(key, fallback) {\n    var raw = storageGet(key);\n    if (raw === null || raw === \"\") return fallback;\n    var n = Number(raw);\n    return isFinite(n) ? n : fallback;\n  }\n\n  function saveScore(key, value) {\n    storageSet(key, String(value));\n  }\n\n  // 浮动提示，自动消失\n  var toastTimer = null;\n  function showToast(text, kind) {\n    var old = document.querySelector(\".toast\");\n    if (old) old.remove();\n    var el = document.createElement(\"div\");\n    el.className = \"toast\" + (kind ? \" \" + kind : \"\");\n    el.setAttribute(\"role\", \"status\");\n    el.textContent = text;\n    document.body.appendChild(el);\n    if (toastTimer) clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () {\n      el.classList.add(\"hide\");\n      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);\n    }, 1300);\n  }\n\n  // 页面初始化：绑定音效按钮，并给“重新开始”按钮绑定重载\n  function initPage() {\n    bindSoundBtn();\n    var restartBtn = document.getElementById(\"btnRestart\");\n    if (restartBtn) {\n      restartBtn.title = \"重新开始\";\n      restartBtn.addEventListener(\"click\", function () {\n        sfx(\"click\");\n        window.location.reload();\n      });\n    }\n    // 给所有关闭弹窗的通用按钮绑定事件（data-close-modal）\n    var closers = document.querySelectorAll(\"[data-close-modal]\");\n    for (var i = 0; i < closers.length; i++) {\n      closers[i].addEventListener(\"click\", function () {\n        var mask = document.querySelector(\".modal-mask:not(.hidden)\");\n        if (mask) mask.classList.add(\"hidden\");\n      });\n    }\n  }\n\n  function openModal(maskEl) {\n    if (maskEl) maskEl.classList.remove(\"hidden\");\n  }\n\n  function closeModal(maskEl) {\n    if (maskEl) maskEl.classList.add(\"hidden\");\n  }\n\n  // 暴露到全局\n  window.MTG = {\n    sfx: sfx,\n    setSound: setSound,\n    toggleSound: toggleSound,\n    getScore: getScore,\n    saveScore: saveScore,\n    showToast: showToast,\n    initPage: initPage,\n    openModal: openModal,\n    closeModal: closeModal\n  };\n})();\n\n<\/script>\n  <script>\n    (function () {\n      \"use strict\";\n      MTG.initPage();\n\n      var canvas = document.getElementById(\"gameCanvas\");\n      var ctx = canvas.getContext(\"2d\");\n      var W = canvas.width, H = canvas.height;\n      var GROUND = 450;\n      var LAUNCH = { x: 84, y: 370 };\n      var G = 1300;          // 重力加速度（像素/秒²）\n      var MAX_V = 1120;      // 最大初速（像素/秒   if (score >= currentLevel().need) {\n            levelPassed();\n          } else if (nadesLeft <= 0) {\n            levelFailed();\n          } else {\n            sceneTip.textContent = \"继续投掷，剩余 \" + nadesLeft + \" 枚手雷\";\n          }\n        }, 760);\n        MTG.sfx(\"boom\");\n        updateHud();\n        MTG.sfx(pts > 0 ? \"good\" : \"bad\");\n        MTG.showToast(lastResult, pts > 0 ? \"good\" : \"bad\");\n      }\n\n      // 落地或出界且未碰到靶 = 脱靶\n      function landGrenade() {\n        resolveThrow(null);\n      }\n\n      function levelPassed() {\n        canThrow = false;\n        var title = document.getElementById(\"resultTitle\");\n        document.getElementById(\"resultIcon\").textContent = \"🎖️\";\n        document.getElementById(\"resultScore\").textContent = score;\n        document.getElementById(\"resultNeed\").textContent = currentLevel().need;\n        document.getElementById(\"resultHits\").textContent = hits;\n        document.getElementById(\"resultLeft\").textContent = nadesLeft;\n        if (levelIndex >= LEVELS.length - 1) {\n          title.textContent = \"全部关卡通过！\";\n          document.getElementById(\"resultBody\").textContent = \"你完成了全部 7 关（含左右移动靶与上下左右环绕靶），是一名可靠的投弹手！\";\n          document.getElementById(\"actionRetry\").textContent = \"再打一遍全部关卡\";\n        } else {\n          title.textContent = \"第 \" + (levelIndex + 1) + \" 关通过\";\n          document.getElementById(\"resultBody\").textContent = \"得分已达标，下一关靶位更难预测，留意风力与移动规律。\";\n          document.getElementById(\"actionRetry\").textContent = \"进入下一关\";\n        }\n        document.getElementById(\"resultActions\").classList.remove(\"hidden\");\n        MTG.openModal(document.getElementById(\"resultMask\"));\n        MTG.sfx(\"win\");\n      }\n\n      function levelFailed() {\n        canThrow = false;\n        document.getElementById(\"resultIcon\").textContent = \"📉\";\n        document.getElementById(\"resultTitle\").textContent = \"第 \" + (levelIndex + 1) + \" 关未达标\";\n        document.getElementById(\"resultScore\").textContent = score;\n        document.getElementById(\"resultNeed\").textContent = currentLevel().need;\n        document.getElementById(\"resultHits\").textContent = hits;\n        document.getElementById(\"resultLeft\").textContent = 0;\n        document.getElementById(\"resultBody\").textContent = \"5 枚训练手雷已用完仍未达标。多观察靶标位置/移动节奏，把风力也估算进去再试。\";\n        document.getElementById(\"actionRetry\").textContent = \"重新挑战本关\";\n        document.getElementById(\"resultActions\").classList.remove(\"hidden\");\n        MTG.openModal(document.getElementById(\"resultMask\"));\n        MTG.sfx(\"lose\");\n      }\n\n      document.getElementById(\"actionRetry\").addEventListener(\"click\", function () {\n        MTG.sfx(\"click\");\n        if (document.getElementById(\"resultTitle\").textContent.indexOf(\"全部关卡\") === 0) {\n          loadLevel(0);\n        } else if (document.getElementById(\"resultTitle\").textContent.indexOf(\"未达标\") < 0 &&\n                   document.getElementById(\"resultTitle\").textContent.indexOf(\"通过\") >= 0) {\n          loadLevel(levelIndex + 1);\n        } else {\n          loadLevel(levelIndex);\n        }\n        MTG.closeModal(document.getElementById(\"resultMask\"));\n      });\n\n      canvas.addEventListener(\"pointerdown\", function (ev) {\n        ev.preventDefault();\n        if (!canThrow) return;\n        aiming = true;\n        pointer = toScene(ev);\n        try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}\n      });\n      canvas.addEventListener(\"pointermove\", function (ev) {\n        if (aiming) pointer = toScene(ev);\n      });\n      canvas.addEventListener(\"pointerup\", function (ev) {\n        ev.preventDefault();\n        if (!aiming) return;\n        aiming = false;\n        if (!canThrow) return;\n        pointer = toScene(ev);\n        var aim = aimState();\n        if (!aim || pointer.x <= LAUNCH.x + 12) {\n          sceneTip.textContent = \"请向目标（右侧）方向拖拽蓄力\";\n          MTG.showToast(\"请向右拖拽再松手\", \"bad\");\n          return;\n        }\n        aimTip.classList.add(\"hidden\");\n        canThrow = false;\n        gun.state = \"fly\";\n        gun.x = LAUNCH.x; gun.y = LAUNCH.y - 34;\n        gun.vx = aim.v * Math.cos(aim.angle);\n        gun.vy = -aim.v * Math.sin(aim.angle);\n        prevGun = { x: gun.x, y: gun.y };\n        flightMin = null;\n        zoneInside = false;\n        sceneTip.textContent = \"手雷飞行中……\";\n        MTG.sfx(\"throw\");\n      });\n      canvas.addEventListener(\"pointercancel\", function () {\n        aiming = false;\n        aimTip.classList.add(\"hidden\");\n      });\n\n      // 拖拽中更新右下角角度/力度\n      var aimChecker = setInterval(function () {\n        if (aiming && canThrow) {\n          var aim = aimState();\n          if (aim) {\n            var deg = Math.round(aim.angle * 180 / Math.PI);\n            var per = Math.round(aim.power * 100);\n            aimTip.textContent = \"角度 \" + deg + \"° ｜ 力度 \" + per + \"%\";\n            aimTip.classList.remove(\"hidden\");\n          } else {\n            aimTip.classList.add(\"hidden\");\n          }\n        } else {\n          aimTip.classList.add(\"hidden\");\n        }\n      }, 60);\n\n      loadLevel(0);\n      lastTs = performance.now();\n      rafId = requestAnimationFrame(loop);\n    })();\n  <\/script>\n<script>\n(function () {\n  \"use strict\";\n  function goHome() {\n    try { if (window.parent && window.parent !== window) window.parent.postMessage({ mtgCmd: \"home\" }, \"*\"); } catch (e) {}\n  }\n  document.addEventListener(\"click\", function (ev) {\n    var n = ev.target;\n    while (n && n !== document && !(n.tagName && n.tagName.toLowerCase() === \"a\")) n = n.parentNode;\n    if (n && n.getAttribute && /(^|\\/)index\\.html(#.*)?$/i.test(n.getAttribute(\"href\") || \"\")) {\n      ev.preventDefault(); ev.stopPropagation(); goHome();\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n",
  "memory": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n  <title>装备对号 - 军训小游戏</title>\n  <style>\n:root {\n  --green-900: #27360f;\n  --green-700: #3c4f1c;\n  --green-600: #4f6528;\n  --green-500: #6b8337;\n  --green-300: #a8b878;\n  --sand-300: #e7d9b4;\n  --sand-400: #d7c08d;\n  --cream: #fbf6e9;\n  --ink: #2b2a19;\n  --danger: #a63a2b;\n  --warn: #c07f13;\n  --ok: #3f7d32;\n  --radius: 14px;\n  --shadow: 0 8px 22px rgba(30, 40, 10, 0.28);\n  --shadow-sm: 0 3px 9px rgba(30, 40, 10, 0.2);\n}\n\n* { box-sizing: border-box; }\n\nhtml, body { margin: 0; padding: 0; }\n\nbody {\n  min-height: 100vh;\n  color: var(--ink);\n  font-family: \"Microsoft YaHei\", \"PingFang SC\", \"Segoe UI\", system-ui, sans-serif;\n  background-color: #46552a;\n  background-image:\n    radial-gradient(circle at 18% 22%, rgba(107, 131, 55, 0.85) 0 48px, transparent 48px),\n    radial-gradient(circle at 72% 70%, rgba(38, 54, 15, 0.75) 0 70px, transparent 70px),\n    radial-gradient(circle at 55% 28%, rgba(137, 154, 93, 0.5) 0 46px, transparent 46px),\n    radial-gradient(circle at 30% 82%, rgba(60, 79, 28, 0.9) 0 60px, transparent 60px),\n    linear-gradient(135deg, #3f4f25 0%, #55682f 55%, #39491f 100%);\n  line-height: 1.6;\n  -webkit-tap-highlight-color: transparent;\n}\n\nbutton { font-family: inherit; }\n\n.page {\n  width: 100%;\n  max-width: 1080px;\n  margin: 0 auto;\n  padding: 12px 12px 28px;\n}\n\n/* 顶部工具条 */\n.toolbar {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 12px;\n  background: rgba(43, 59, 22, 0.92);\n  border: 2px solid rgba(231, 217, 180, 0.35);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-sm);\n  color: var(--cream);\n}\n\n.toolbar h1 {\n  flex: 1;\n  margin: 0 8px;\n  font-size: 1.2rem;\n  letter-spacing: 2px;\n  text-align: center;\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  min-width: 48px;\n  min-height: 44px;\n  padding: 9px 16px;\n  border: 0;\n  border-radius: 10px;\n  font-size: 1rem;\n  font-weight: 700;\n  color: var(--cream);\n  background: linear-gradient(180deg, var(--green-500), var(--green-700));\n  box-shadow: 0 3px 0 var(--green-900), var(--shadow-sm);\n  cursor: pointer;\n  text-decoration: none;\n  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;\n  touch-action: manipulation;\n  user-select: none;\n  -webkit-user-select: none;\n}\n\n.btn:hover { filter: brightness(1.12); }\n.btn:active {\n  transform: translateY(2px);\n  box-shadow: 0 1px 0 var(--green-900);\n}\n\n.btn.ghost {\n  color: var(--green-900);\n  background: linear-gradient(180deg, var(--sand-300), var(--sand-400));\n  box-shadow: 0 3px 0 #9b8754;\n}\n\n.btn.warn {\n  background: linear-gradient(180deg, #c98325, #9a5d12);\n  box-shadow: 0 3px 0 #5f3a0a;\n}\n\n.btn:disabled {\n  filter: grayscale(0.75);\n  opacity: 0.55;\n  cursor: not-allowed;\n  transform: none;\n}\n\n.icon-btn {\n  width: 46px;\n  height: 46px;\n  min-width: 46px;\n  min-height: 46px;\n  padding: 0;\n  font-size: 1.25rem;\n  border-radius: 50%;\n}\n\n/* 通用面板 */\n.panel {\n  margin-top: 14px;\n  padding: 14px 16px;\n  border-radius: var(--radius);\n  background: var(--cream);\n  box-shadow: var(--shadow);\n  border: 1px solid rgba(88, 73, 33, 0.25);\n}\n\n.panel h2, .panel h3 {\n  margin: 0 0 6px;\n  color: var(--green-900);\n}\n\n.panel p { margin: 6px 0; }\n\n/* 状态栏 */\n.hud {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-top: 14px;\n  justify-content: center;\n}\n\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  padding: 7px 13px;\n  border-radius: 999px;\n  background: var(--cream);\n  border: 2px solid var(--sand-400);\n  box-shadow: var(--shadow-sm);\n  font-weight: 700;\n  white-space: nowrap;\n}\n\n.chip b { color: var(--green-700); font-size: 1.05em; }\n.chip.danger b { color: var(--danger); }\n.chip.ok b { color: var(--ok); }\n\n/* 主舞台 */\n.arena {\n  margin-top: 14px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 14px;\n}\n\n.stage-box {\n  width: 100%;\n  max-width: 860px;\n  border-radius: var(--radius);\n  background: var(--cream);\n  box-shadow: var(--shadow);\n  border: 1px solid rgba(88, 73, 33, 0.25);\n  overflow: hidden;\n}\n\n/* 弹窗 */\n.modal-mask {\n  position: fixed;\n  inset: 0;\n  z-index: 90;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 18px;\n  background: rgba(18, 25, 8, 0.68);\n  backdrop-filter: blur(2px);\n}\n\n.modal-card {\n  width: 100%;\n  max-width: 460px;\n  max-height: 86vh;\n  overflow: auto;\n  padding: 22px;\n  border-radius: 18px;\n  background:\n    linear-gradient(180deg, rgba(251, 246, 233, 0.97), rgba(235, 221, 186, 0.98));\n  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);\n  border: 3px solid var(--green-600);\n  text-align: center;\n  color: var(--ink);\n}\n\n.modal-card h2 {\n  margin: 0 0 8px;\n  font-size: 1.45rem;\n  color: var(--green-900);\n}\n\n.modal-card h2.big-icon { font-size: 2.6rem; }\n.modal-body { margin: 8px 0 16px; font-size: 1.02rem; }\n.modal-actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n.modal-actions .btn { min-width: 130px; }\n\n.stat-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 8px;\n  margin: 10px 0;\n}\n.stat-grid .stat {\n  padding: 9px 6px;\n  border-radius: 10px;\n  background: rgba(216, 194, 141, 0.35);\n  border: 1px solid rgba(120, 100, 45, 0.25);\n}\n.stat .label { font-size: 0.86rem; color: #665c3c; }\n.stat .value { font-size: 1.25rem; font-weight: 800; color: var(--green-900); }\n.stat .value.danger { color: var(--danger); }\n.stat .value.ok { color: var(--ok); }\n\n/* 轻提示 */\n.toast {\n  position: fixed;\n  left: 50%;\n  top: 16%;\n  z-index: 80;\n  transform: translateX(-50%);\n  padding: 10px 20px;\n  border-radius: 999px;\n  font-size: 1.05rem;\n  font-weight: 800;\n  color: #fff;\n  background: rgba(39, 54, 15, 0.92);\n  box-shadow: var(--shadow);\n  pointer-events: none;\n  text-align: center;\n  max-width: 88vw;\n  transition: opacity 0.25s ease;\n}\n.toast.hide { opacity: 0; }\n.toast.good { background: rgba(47, 103, 36, 0.94); }\n.toast.bad { background: rgba(160, 49, 35, 0.95); }\n\n/* 方向键区 */\n.dirpad {\n  display: grid;\n  grid-template-areas:\n    \". up .\"\n    \"left down right\";\n  grid-template-columns: repeat(3, 72px);\n  grid-template-rows: repeat(2, 72px);\n  gap: 8px;\n  justify-content: center;\n  margin: 4px auto;\n}\n\n.dirpad .pad-btn {\n  min-width: 64px;\n  min-height: 64px;\n  padding: 0;\n  border-radius: 12px;\n  font-size: 1.6rem;\n  background: linear-gradient(180deg, var(--green-500), var(--green-700));\n  color: #fff;\n  box-shadow: 0 4px 0 var(--green-900), var(--shadow-sm);\n  border: 0;\n  cursor: pointer;\n  touch-action: manipulation;\n  user-select: none;\n  -webkit-user-select: none;\n}\n.dirpad .pad-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-900); }\n.pad-up { grid-area: up; }\n.pad-down { grid-area: down; }\n.pad-left { grid-area: left; }\n.pad-right { grid-area: right; }\n\n/* 操作说明 */\n.help-box {\n  margin-top: 14px;\n  font-size: 0.94rem;\n  background: var(--cream);\n  color: var(--ink);\n}\n.help-box kbd {\n  display: inline-block;\n  padding: 1px 7px;\n  border-radius: 5px;\n  background: #e8e1cb;\n  border: 1px solid #b8a976;\n  box-shadow: 0 2px 0 #b3a66f;\n  font-size: 0.9em;\n  font-weight: 700;\n}\n\n/* 首页 */\n.hero {\n  margin-top: 16px;\n  padding: 26px 18px;\n  text-align: center;\n  color: var(--cream);\n}\n.hero h1 {\n  margin: 0 0 8px;\n  font-size: clamp(1.6rem, 5vw, 2.6rem);\n  letter-spacing: 8px;\n  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);\n}\n.hero p { margin: 0; font-size: 1rem; color: var(--sand-300); }\n\n.version-tag {\n  display: inline-block;\n  margin-left: 8px;\n  padding: 2px 10px;\n  border-radius: 999px;\n  background: var(--sand-400);\n  color: var(--green-900);\n  font-size: 0.8rem;\n  letter-spacing: 0;\n  vertical-align: 6px;\n}\n\n.cards {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\n  gap: 14px;\n  margin-top: 18px;\n}\n\n.card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  min-height: 168px;\n  padding: 18px;\n  border-radius: 16px;\n  color: var(--ink);\n  text-decoration: none;\n  background:\n    linear-gradient(155deg, rgba(251, 246, 233, 0.96) 0%, rgba(231, 217, 180, 0.96) 100%);\n  border: 2px solid rgba(105, 118, 58, 0.45);\n  box-shadow: var(--shadow-sm);\n  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;\n  overflow: hidden;\n}\n.card::after {\n  content: \"\";\n  position: absolute;\n  right: -28px;\n  bottom: -28px;\n  width: 100px;\n  height: 100px;\n  border-radius: 50%;\n  background: radial-gradient(circle, rgba(107, 131, 55, 0.35), transparent 70%);\n}\n.card:hover {\n  transform: translateY(-4px);\n  border-color: var(--green-500);\n  box-shadow: var(--shadow);\n}\n.card .num {\n  position: absolute;\n  top: 10px;\n  right: 12px;\n  font-size: 1.05rem;\n  font-weight: 800;\n  color: rgba(60, 79, 28, 0.45);\n}\n.card .icon { font-size: 2.4rem; line-height: 1; }\n.card h2 { margin: 0; font-size: 1.22rem; color: var(--green-900); }\n.card p { margin: 0; font-size: 0.92rem; flex: 1; }\n.card .foot {\n  font-size: 0.8rem;\n  color: #73693f;\n  border-top: 1px dashed rgba(115, 105, 63, 0.4);\n  padding-top: 7px;\n}\n\nfooter.note {\n  margin: 22px auto 4px;\n  text-align: center;\n  color: var(--sand-300);\n  font-size: 0.88rem;\n}\n\n.hidden { display: none !important; }\n\n/* 手机窄屏适配 */\n@media (max-width: 640px) {\n  .toolbar { gap: 5px; padding: 8px; }\n  .toolbar h1 { font-size: 1rem; letter-spacing: 1px; }\n  .icon-btn { width: 46px; height: 46px; min-width: 46px; min-height: 46px; }\n  .btn { padding: 9px 11px; }\n  .dirpad { grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    transition-duration: 0.01ms !important;\n  }\n}\n\n</style>\n  <style>\n    .memory-board-wrap { width: 100%; max-width: 640px; }\n    .memory-board {\n      display: grid;\n      gap: clamp(4px, 1.4vw, 9px);\n      padding: clamp(8px, 2vw, 14px);\n      width: 100%;\n    }\n    .memory-board.cols4 { grid-template-columns: repeat(4, 1fr); }\n    .memory-board.cols6 { grid-template-columns: repeat(6, 1fr); }\n\n    .mcard {\n      position: relative;\n      aspect-ratio: 1 / 1.08;\n      border: 0;\n      padding: 0;\n      background: transparent;\n      perspective: 700px;\n      cursor: pointer;\n      -webkit-tap-highlight-color: transparent;\n      touch-action: manipulation;\n    }\n    .mcard .inner {\n      position: absolute;\n      inset: 0;\n      transform-style: preserve-3d;\n      transition: transform 0.38s ease;\n    }\n    .mcard.flipped .inner { transform: rotateY(180deg); }\n    .mcard .face {\n      position: absolute;\n      inset: 0;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      gap: 2px;\n      border-radius: 12px;\n      backface-visibility: hidden;\n      -webkit-backface-visibility: hidden;\n      overflow: hidden;\n      border: 2px solid #a8975f;\n      box-shadow: inset 0 -5px 0 rgba(0,0,0,0.08), 0 3px 7px rgba(40,45,15,0.2);\n      text-align: center;\n      padding: 3px;\n    }\n    .mcard .front {\n      transform: rotateY(180deg);\n      background: linear-gradient(160deg, #f4ecd7, #e2d3ab);\n      color: #37471a;\n    }\n    .mcard .front .pic { font-size: clamp(1.3rem, 6.5vw, 2.3rem); line-height: 1.1; }\n    .mcard .front .name { font-size: clamp(0.52rem, 2.4vw, 0.92rem); font-weight: 800; }\n    .mcard .back {\n      background:\n        repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 10px, transparent 10px 20px),\n        linear-gradient(150deg, #4c5f28, #33441a 70%);\n      color: rgba(255, 244, 215, 0.7);\n      font-size: clamp(1rem, 4vw, 1.6rem);\n    }\n    .mcard.matched .front {\n      background: linear-gradient(160deg, #d6e3b1, #aac27a);\n      border-color: var(--ok);\n      box-shadow: 0 0 0 2px rgba(63,125,50,0.25);\n    }\n    .mcard.wrong .inner { animation: shake 0.35s ease; }\n    .mcard.done { opacity: 0.82; pointer-events: none; }\n    .memory-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }\n    .best-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }\n  </style>\n</head>\n<body>\n  <header class=\"toolbar\">\n    <a class=\"btn ghost\" href=\"index.html\" aria-label=\"返回主页\">← 主页</a>\n    <h1>装备对号</h1>\n    <button class=\"icon-btn\" id=\"btnRestart\" type=\"button\" aria-label=\"重新开始\">↻</button>\n    <button class=\"icon-btn\" id=\"btnSound\" type=\"button\" aria-label=\"音效开关\">🔇</button>\n  </header>\n\n  <main class=\"page\">\n    <section class=\"hud\" aria-label=\"游戏状态\">\n      <span class=\"chip\" id=\"diffChip\">难度 <b>初级 4×4</b></span>\n      <span class=\"chip\">用时 <b id=\"timeVal\">00:00</b></span>\n      <span class=\"chip\">翻牌 <b id=\"flips\">0</b> 次</span>\n      <span class=\"chip ok\">配对 <b id=\"matched\">0</b></span>\n    </section>\n\n    <section class=\"arena memory-board-wrap\">\n      <div class=\"panel memory-controls\" id=\"startPanel\">\n        <p style=\"width:100%;text-align:center;margin:0 0 4px\"><strong>选择难度开始训练</strong></p>\n        <button class=\"btn\" type=\"button\" data-diff=\"4\">4×4 初级（8 对）</button>\n        <button class=\"btn warn\" type=\"button\" data-diff=\"6\">6×6 进阶（18 对）</button>\n      </div>\n      <div class=\"memory-board cols4\" id=\"board\"></div>\n    </section>\n\n    <section class=\"panel help-box\">\n      <h3>玩法与规则</h3>\n      <p>每两张卡牌是一对相同的军用品 / 军衔 / 武器装备（图标 + 名称）。每次翻开两张，相同则保持正面并得分，不同会盖回去，把全部配齐即可通关。</p>\n      <p>鼠标 / 手指直接轻点卡牌翻开即可；翻牌次数越多说明记忆越模糊，用时与步数都会计入最终评价。</p>\n      <div class=\"best-row\" id=\"bestRow\"></div>\n    </section>\n  </main>\n\n  <div class=\"modal-mask hidden\" id=\"resultMask\">\n    <section class=\"modal-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"resultTitle\">\n      <h2 class=\"big-icon\">🎉</h2>\n      <h2 id=\"resultTitle\">装备对号完成</h2>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"label\">用时</div><div class=\"value\" id=\"resultTime\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">翻牌次数</div><div class=\"value\" id=\"resultFlips\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">刷新纪录</div><div class=\"value ok\" id=\"resultRecord\">-</div></div>\n      </div>\n      <div class=\"modal-body\" id=\"resultBody\"></div>\n      <div class=\"modal-actions\">\n        <button class=\"btn\" id=\"againBtn\" type=\"button\">再来一局</button>\n        <a class=\"btn ghost\" href=\"index.html\">返回主页</a>\n      </div>\n    </section>\n  </div>\n\n  <script>\n/* 公共辅助：音效开关、音效生成、最高分读写、通用轻提示 */\n(function () {\n  \"use strict\";\n\n  var STORAGE_KEY = \"mtg_sound_on\";\n  var soundOn = false;\n  var audioCtx = null;\n\n  // 兼容 file:// 下 localStorage 不可用的情况\n  function storageGet(key) {\n    try {\n      return window.localStorage.getItem(key);\n    } catch (e) {\n      return null;\n    }\n  }\n\n  function storageSet(key, value) {\n    try {\n      window.localStorage.setItem(key, value);\n    } catch (e) {\n      /* 忽略：隐私模式或 file:// 限制时仅本次会话有效 */\n    }\n  }\n\n  function ensureCtx() {\n    if (!audioCtx) {\n      var AC = window.AudioContext || window.webkitAudioContext;\n      if (AC) {\n        audioCtx = new AC();\n      }\n    }\n    if (audioCtx && audioCtx.state === \"suspended\") {\n      audioCtx.resume();\n    }\n    return audioCtx;\n  }\n\n  function tone(freq, dur, when, type, volume) {\n    var ctx = audioCtx;\n    if (!ctx) return;\n    var t0 = ctx.currentTime + (when || 0);\n    var osc = ctx.createOscillator();\n    var gain = ctx.createGain();\n    osc.type = type || \"square\";\n    osc.frequency.setValueAtTime(freq, t0);\n    gain.gain.setValueAtTime(0.0001, t0);\n    gain.gain.exponentialRampToValueAtTime(volume || 0.12, t0 + 0.012);\n    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n    osc.connect(gain);\n    gain.connect(ctx.destination);\n    osc.start(t0);\n    osc.stop(t0 + dur + 0.04);\n  }\n\n  function sfx(kind) {\n    if (!soundOn || !ensureCtx()) return;\n    switch (kind) {\n      case \"click\": tone(480, 0.07, 0, \"square\", 0.08); break;\n      case \"good\": tone(660, 0.08, 0); tone(880, 0.1, 0.09); break;\n      case \"bad\": tone(180, 0.22, 0, \"sawtooth\", 0.11); break;\n      case \"flip\": tone(700, 0.05, 0, \"triangle\", 0.08); break;\n      case \"tick\": tone(1000, 0.04, 0, \"square\", 0.05); break;\n      case \"win\":\n        tone(523, 0.1, 0);\n        tone(659, 0.1, 0.12);\n        tone(784, 0.18, 0.24);\n        break;\n      case \"lose\":\n        tone(392, 0.16, 0);\n        tone(311, 0.16, 0.16);\n        tone(233, 0.3, 0.32);\n        break;\n      case \"throw\": tone(300, 0.25, 0, \"sawtooth\", 0.07); break;\n      case \"boom\": tone(120, 0.32, 0, \"sawtooth\", 0.16); break;\n      case \"step\": tone(520, 0.05, 0, \"triangle\", 0.06); break;\n      default: tone(440, 0.08, 0);\n    }\n  }\n\n  function setSound(on, persist) {\n    soundOn = !!on;\n    var btn = document.getElementById(\"btnSound\");\n    if (btn) {\n      btn.textContent = soundOn ? \"🔊\" : \"🔇\";\n      btn.title = soundOn ? \"音效：开（点击关闭）\" : \"音效：关（点击开启）\";\n      btn.setAttribute(\"aria-pressed\", soundOn ? \"true\" : \"false\");\n    }\n    if (persist !== false) storageSet(STORAGE_KEY, soundOn ? \"1\" : \"0\");\n  }\n\n  function toggleSound() {\n    setSound(!soundOn);\n    if (soundOn) {\n      ensureCtx();\n      sfx(\"click\");\n    }\n    return soundOn;\n  }\n\n  function bindSoundBtn() {\n    var btn = document.getElementById(\"btnSound\");\n    if (btn) {\n      btn.addEventListener(\"click\", function (ev) {\n        ev.stopPropagation();\n        toggleSound();\n      });\n    }\n    soundOn = storageGet(STORAGE_KEY) === \"1\"; // 音效总开关，默认关闭\n    setSound(soundOn, false);\n  }\n\n  function getScore(key, fallback) {\n    var raw = storageGet(key);\n    if (raw === null || raw === \"\") return fallback;\n    var n = Number(raw);\n    return isFinite(n) ? n : fallback;\n  }\n\n  function saveScore(key, value) {\n    storageSet(key, String(value));\n  }\n\n  // 浮动提示，自动消失\n  var toastTimer = null;\n  function showToast(text, kind) {\n    var old = document.querySelector(\".toast\");\n    if (old) old.remove();\n    var el = document.createElement(\"div\");\n    el.className = \"toast\" + (kind ? \" \" + kind : \"\");\n    el.setAttribute(\"role\", \"status\");\n    el.textContent = text;\n    document.body.appendChild(el);\n    if (toastTimer) clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () {\n      el.classList.add(\"hide\");\n      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);\n    }, 1300);\n  }\n\n  // 页面初始化：绑定音效按钮，并给“重新开始”按钮绑定重载\n  function initPage() {\n    bindSoundBtn();\n    var restartBtn = document.getElementById(\"btnRestart\");\n    if (restartBtn) {\n      restartBtn.title = \"重新开始\";\n      restartBtn.addEventListener(\"click\", function () {\n        sfx(\"click\");\n        window.location.reload();\n      });\n    }\n    // 给所有关闭弹窗的通用按钮绑定事件（data-close-modal）\n    var closers = document.querySelectorAll(\"[data-close-modal]\");\n    for (var i = 0; i < closers.length; i++) {\n      closers[i].addEventListener(\"click\", function () {\n        var mask = document.querySelector(\".modal-mask:not(.hidden)\");\n        if (mask) mask.classList.add(\"hidden\");\n      });\n    }\n  }\n\n  function openModal(maskEl) {\n    if (maskEl) maskEl.classList.remove(\"hidden\");\n  }\n\n  function closeModal(maskEl) {\n    if (maskEl) maskEl.classList.add(\"hidden\");\n  }\n\n  // 暴露到全局\n  window.MTG = {\n    sfx: sfx,\n    setSound: setSound,\n    toggleSound: toggleSound,\n    getScore: getScore,\n    saveScore: saveScore,\n    showToast: showToast,\n    initPage: initPage,\n    openModal: openModal,\n    closeModal: closeModal\n  };\n})();\n\n<\/script>\n  <script>\n    (function () {\n      \"use strict\";\n      MTG.initPage();\n\n      var ITEMS = [\n        { pic: \"🪖\", name: \"钢盔\" },\n        { pic: \"🎖️\", name: \"勋章\" },\n        { pic: \"🧭\", name: \"指北针\" },\n        { pic: \"🔭\", name: \"望远镜\" },\n        { pic: \"🎒\", name: \"行军背包\" },\n        { pic: \"🥾\", name: \"军靴\" },\n        { pic: \"🍶\", name: \"军用水壶\" },\n        { pic: \"⛏️\", name: \"工兵铲\" },\n        { pic: \"📻\", name: \"野战电台\" },\n        { pic: \"🚩\", name: \"信号旗\" },\n        { pic: \"🗡️\", name: \"匕首\" },\n        { pic: \"💣\", name: \"手雷\" },\n        { pic: \"🔫\", name: \"步枪\" },\n        { pic: \"🧨\", name: \"炸药包\" },\n        { pic: \"🩹\", name: \"急救包\" },\n        { pic: \"🪂\", name: \"降落伞\" },\n        { pic: \"🥽\", name: \"防毒面具\" },\n        { pic: \"🎺\", name: \"冲锋号\" }\n      ];\n\n      var board = document.getElementById(\"board\");\n      var cols = 4;\n      var pairsTotal = 8;\n      var state = \"idle\";       // idle / playing / done\n      var cards = [];\n      var openIndices = [];\n      var matchedCount = 0;\n      var flips = 0;\n      var timerId = null;\n      var startAt = 0;\n      var lock = false;\n      var bestKey = \"mtg_memory_best_\";\n\n      var timeVal = document.getElementById(\"timeVal\");\n      var flipsEl = document.getElementById(\"flips\");\n      var matchedEl = document.getElementById(\"matched\");\n      var diffChip = document.getElementById(\"diffChip\");\n\n      function fmtTime(sec) {\n        var m = Math.floor(sec / 60);\n        var s = Math.floor(sec % 60);\n        return (m < 10 ? \"0\" : \"\") + m + \":\" + (s < 10 ? \"0\" : \"\") + s;\n      }\n\n      function shuffle(arr) {\n        for (var i = arr.length - 1; i > 0; i--) {\n          var j = Math.floor(Math.random() * (i + 1));\n          var t = arr[i]; arr[i] = arr[j]; arr[j] = t;\n        }\n        return arr;\n      }\n\n      function newGame(size) {\n        cols = size;\n        pairsTotal = (size * size) / 2;\n        var pool = shuffle(ITEMS.slice()).slice(0, pairsTotal);\n        var deck = [];\n        for (var i = 0; i < pool.length; i++) {\n          deck.push({ kind: \"a\", item: pool[i] });\n          deck.push({ kind: \"b\", item: pool[i] });\n        }\n        cards = shuffle(deck);\n        matchedCount = 0;\n        flips = 0;\n        openIndices = [];\n        state = \"playing\";\n        startAt = Date.now();\n        if (timerId) clearInterval(timerId);\n        updateHud();\n        renderBoard();\n        diffChip.innerHTML = \"难度 <b>\" + (cols === 4 ? \"初级 4×4\" : \"进阶 6×6\") + \"</b>\";\n        document.getElementById(\"startPanel\").classList.add(\"hidden\");\n        timerId = setInterval(function () {\n          if (state === \"playing\") {\n            timeVal.textContent = fmtTime((Date.now() - startAt) / 1000);\n          }\n        }, 200);\n      }\n\n      function updateHud() {\n        flipsEl.textContent = flips;\n        matchedEl.textContent = matchedCount;\n      }\n\n      function renderBoard() {\n        board.className = \"memory-board \" + (cols === 4 ? \"cols4\" : \"cols6\");\n        board.innerHTML = \"\";\n        for (var i = 0; i < cards.length; i++) {\n          var card = document.createElement(\"button\");\n          card.type = \"button\";\n          card.className = \"mcard\";\n          card.dataset.index = i;\n          card.setAttribute(\"aria-label\", \"卡牌 \" + (i + 1));\n          var inner = document.createElement(\"span\");\n          inner.className = \"inner\";\n          var front = document.createElement(\"span\");\n          front.className = \"face front\";\n          front.innerHTML = '<span class=\"pic\">' + cards[i].item.pic + '</span><span class=\"name\">' + cards[i].item.name + \"</span>\";\n          var back = document.createElement(\"span\");\n          back.className = \"face back\";\n          back.textContent = \"★\";\n          inner.appendChild(front);\n          inner.appendChild(back);\n          card.appendChild(inner);\n          card.addEventListener(\"click\", function () { onCardClick(this); });\n          board.appendChild(card);\n        }\n      }\n\n      function onCardClick(el) {\n        if (state !== \"playing\" || lock) return;\n        var idx = Number(el.dataset.index);\n        if (openIndices.indexOf(idx) >= 0 || cards[idx].matched) return;\n        flips += 1;\n        openIndices.push(idx);\n        el.classList.add(\"flipped\");\n        MTG.sfx(\"flip\");\n        updateHud();\n        if (openIndices.length === 2) {\n          lock = true;\n          var a = openIndices[0], b = openIndices[1];\n          if (cards[a].item === cards[b].item) {\n            // 配对成功\n            window.setTimeout(function () {\n              cards[a].matched = true;\n              cards[b].matched = true;\n              matchedCount += 1;\n              board.children[a].classList.add(\"matched\", \"done\");\n              board.children[b].classList.add(\"matched\", \"done\");\n              openIndices = [];\n              lock = false;\n              updateHud();\n              MTG.sfx(\"good\");\n              if (matchedCount >= pairsTotal) finishGame();\n            }, 300);\n          } else {\n            // 配对失败，先抖一下再翻回\n            window.setTimeout(function () {\n              board.children[a].classList.add(\"wrong\");\n              board.children[b].classList.add(\"wrong\");\n              MTG.sfx(\"bad\");\n            }, 520);\n            window.setTimeout(function () {\n              board.children[a].classList.remove(\"flipped\", \"wrong\");\n              board.children[b].classList.remove(\"flipped\", \"wrong\");\n              openIndices = [];\n              lock = false;\n            }, 1050);\n          }\n        }\n      }\n\n      function finishGame() {\n        state = \"done\";\n        clearInterval(timerId);\n        var sec = Math.round((Date.now() - startAt) / 1000);\n        var steps = Math.ceil(flips / 2);\n        var key = bestKey + cols;\n        var rec = MTG.getScore(key, null);\n        var isNew = rec === null || sec < rec;\n        if (isNew) MTG.saveScore(key, sec);\n        document.getElementById(\"resultTitle\").textContent = (cols === 4 ? \"初级 4×4\" : \"进阶 6×6\") + \" 通关\";\n        document.getElementById(\"resultTime\").textContent = fmtTime(sec);\n        document.getElementById(\"resultFlips\").textContent = flips + \" 次（\" + steps + \" 步）\";\n        document.getElementById(\"resultRecord\").textContent = isNew ? \"新纪录！\" : \"最快 \" + fmtTime(rec);\n        document.getElementById(\"resultBody\").textContent =\n          \"全部 \" + pairsTotal + \" 对装备已对上号。评价：\" + (flips <= pairsTotal + Math.round(pairsTotal * 0.5) ? \"过目不忘，侦察兵级别的记忆力！\" : \"完成得很稳，多练几次可以更快。\");\n        MTG.openModal(document.getElementById(\"resultMask\"));\n        MTG.sfx(\"win\");\n        renderBest();\n      }\n\n      function renderBest() {\n        var row = document.getElementById(\"bestRow\");\n        row.innerHTML = \"\";\n        [4, 6].forEach(function (s) {\n          var sec = MTG.getScore(bestKey + s, null);\n          var span = document.createElement(\"span\");\n          span.textContent = s === 4 ? \"初级最快：\" : \"进阶最快：\";\n          if (sec === null) {\n            span.textContent += \"暂无纪录\";\n          } else {\n            span.textContent += fmtTime(sec);\n          }\n          row.appendChild(span);\n        });\n      }\n\n      var diffBtns = document.querySelectorAll(\"#startPanel [data-diff]\");\n      for (var i = 0; i < diffBtns.length; i++) {\n        diffBtns[i].addEventListener(\"click\", function () {\n          MTG.sfx(\"click\");\n          newGame(Number(this.getAttribute(\"data-diff\")));\n        });\n      }\n\n      document.getElementById(\"againBtn\").addEventListener(\"click\", function () {\n        MTG.sfx(\"click\");\n        newGame(cols);\n        MTG.closeModal(document.getElementById(\"resultMask\"));\n      });\n      renderBest();\n    })();\n  <\/script>\n<script>\n(function () {\n  \"use strict\";\n  function goHome() {\n    try { if (window.parent && window.parent !== window) window.parent.postMessage({ mtgCmd: \"home\" }, \"*\"); } catch (e) {}\n  }\n  document.addEventListener(\"click\", function (ev) {\n    var n = ev.target;\n    while (n && n !== document && !(n.tagName && n.tagName.toLowerCase() === \"a\")) n = n.parentNode;\n    if (n && n.getAttribute && /(^|\\/)index\\.html(#.*)?$/i.test(n.getAttribute(\"href\") || \"\")) {\n      ev.preventDefault(); ev.stopPropagation(); goHome();\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n",
  "sweep": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n  <title>工兵排雷 - 军训小游戏</title>\n  <style>\n:root {\n  --green-900: #27360f;\n  --green-700: #3c4f1c;\n  --green-600: #4f6528;\n  --green-500: #6b8337;\n  --green-300: #a8b878;\n  --sand-300: #e7d9b4;\n  --sand-400: #d7c08d;\n  --cream: #fbf6e9;\n  --ink: #2b2a19;\n  --danger: #a63a2b;\n  --warn: #c07f13;\n  --ok: #3f7d32;\n  --radius: 14px;\n  --shadow: 0 8px 22px rgba(30, 40, 10, 0.28);\n  --shadow-sm: 0 3px 9px rgba(30, 40, 10, 0.2);\n}\n\n* { box-sizing: border-box; }\n\nhtml, body { margin: 0; padding: 0; }\n\nbody {\n  min-height: 100vh;\n  color: var(--ink);\n  font-family: \"Microsoft YaHei\", \"PingFang SC\", \"Segoe UI\", system-ui, sans-serif;\n  background-color: #46552a;\n  background-image:\n    radial-gradient(circle at 18% 22%, rgba(107, 131, 55, 0.85) 0 48px, transparent 48px),\n    radial-gradient(circle at 72% 70%, rgba(38, 54, 15, 0.75) 0 70px, transparent 70px),\n    radial-gradient(circle at 55% 28%, rgba(137, 154, 93, 0.5) 0 46px, transparent 46px),\n    radial-gradient(circle at 30% 82%, rgba(60, 79, 28, 0.9) 0 60px, transparent 60px),\n    linear-gradient(135deg, #3f4f25 0%, #55682f 55%, #39491f 100%);\n  line-height: 1.6;\n  -webkit-tap-highlight-color: transparent;\n}\n\nbutton { font-family: inherit; }\n\n.page {\n  width: 100%;\n  max-width: 1080px;\n  margin: 0 auto;\n  padding: 12px 12px 28px;\n}\n\n/* 顶部工具条 */\n.toolbar {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 12px;\n  background: rgba(43, 59, 22, 0.92);\n  border: 2px solid rgba(231, 217, 180, 0.35);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-sm);\n  color: var(--cream);\n}\n\n.toolbar h1 {\n  flex: 1;\n  margin: 0 8px;\n  font-size: 1.2rem;\n  letter-spacing: 2px;\n  text-align: center;\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  min-width: 48px;\n  min-height: 44px;\n  padding: 9px 16px;\n  border: 0;\n  border-radius: 10px;\n  font-size: 1rem;\n  font-weight: 700;\n  color: var(--cream);\n  background: linear-gradient(180deg, var(--green-500), var(--green-700));\n  box-shadow: 0 3px 0 var(--green-900), var(--shadow-sm);\n  cursor: pointer;\n  text-decoration: none;\n  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;\n  touch-action: manipulation;\n  user-select: none;\n  -webkit-user-select: none;\n}\n\n.btn:hover { filter: brightness(1.12); }\n.btn:active {\n  transform: translateY(2px);\n  box-shadow: 0 1px 0 var(--green-900);\n}\n\n.btn.ghost {\n  color: var(--green-900);\n  background: linear-gradient(180deg, var(--sand-300), var(--sand-400));\n  box-shadow: 0 3px 0 #9b8754;\n}\n\n.btn.warn {\n  background: linear-gradient(180deg, #c98325, #9a5d12);\n  box-shadow: 0 3px 0 #5f3a0a;\n}\n\n.btn:disabled {\n  filter: grayscale(0.75);\n  opacity: 0.55;\n  cursor: not-allowed;\n  transform: none;\n}\n\n.icon-btn {\n  width: 46px;\n  height: 46px;\n  min-width: 46px;\n  min-height: 46px;\n  padding: 0;\n  font-size: 1.25rem;\n  border-radius: 50%;\n}\n\n/* 通用面板 */\n.panel {\n  margin-top: 14px;\n  padding: 14px 16px;\n  border-radius: var(--radius);\n  background: var(--cream);\n  box-shadow: var(--shadow);\n  border: 1px solid rgba(88, 73, 33, 0.25);\n}\n\n.panel h2, .panel h3 {\n  margin: 0 0 6px;\n  color: var(--green-900);\n}\n\n.panel p { margin: 6px 0; }\n\n/* 状态栏 */\n.hud {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-top: 14px;\n  justify-content: center;\n}\n\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  padding: 7px 13px;\n  border-radius: 999px;\n  background: var(--cream);\n  border: 2px solid var(--sand-400);\n  box-shadow: var(--shadow-sm);\n  font-weight: 700;\n  white-space: nowrap;\n}\n\n.chip b { color: var(--green-700); font-size: 1.05em; }\n.chip.danger b { color: var(--danger); }\n.chip.ok b { color: var(--ok); }\n\n/* 主舞台 */\n.arena {\n  margin-top: 14px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 14px;\n}\n\n.stage-box {\n  width: 100%;\n  max-width: 860px;\n  border-radius: var(--radius);\n  background: var(--cream);\n  box-shadow: var(--shadow);\n  border: 1px solid rgba(88, 73, 33, 0.25);\n  overflow: hidden;\n}\n\n/* 弹窗 */\n.modal-mask {\n  position: fixed;\n  inset: 0;\n  z-index: 90;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 18px;\n  background: rgba(18, 25, 8, 0.68);\n  backdrop-filter: blur(2px);\n}\n\n.modal-card {\n  width: 100%;\n  max-width: 460px;\n  max-height: 86vh;\n  overflow: auto;\n  padding: 22px;\n  border-radius: 18px;\n  background:\n    linear-gradient(180deg, rgba(251, 246, 233, 0.97), rgba(235, 221, 186, 0.98));\n  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);\n  border: 3px solid var(--green-600);\n  text-align: center;\n  color: var(--ink);\n}\n\n.modal-card h2 {\n  margin: 0 0 8px;\n  font-size: 1.45rem;\n  color: var(--green-900);\n}\n\n.modal-card h2.big-icon { font-size: 2.6rem; }\n.modal-body { margin: 8px 0 16px; font-size: 1.02rem; }\n.modal-actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n.modal-actions .btn { min-width: 130px; }\n\n.stat-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 8px;\n  margin: 10px 0;\n}\n.stat-grid .stat {\n  padding: 9px 6px;\n  border-radius: 10px;\n  background: rgba(216, 194, 141, 0.35);\n  border: 1px solid rgba(120, 100, 45, 0.25);\n}\n.stat .label { font-size: 0.86rem; color: #665c3c; }\n.stat .value { font-size: 1.25rem; font-weight: 800; color: var(--green-900); }\n.stat .value.danger { color: var(--danger); }\n.stat .value.ok { color: var(--ok); }\n\n/* 轻提示 */\n.toast {\n  position: fixed;\n  left: 50%;\n  top: 16%;\n  z-index: 80;\n  transform: translateX(-50%);\n  padding: 10px 20px;\n  border-radius: 999px;\n  font-size: 1.05rem;\n  font-weight: 800;\n  color: #fff;\n  background: rgba(39, 54, 15, 0.92);\n  box-shadow: var(--shadow);\n  pointer-events: none;\n  text-align: center;\n  max-width: 88vw;\n  transition: opacity 0.25s ease;\n}\n.toast.hide { opacity: 0; }\n.toast.good { background: rgba(47, 103, 36, 0.94); }\n.toast.bad { background: rgba(160, 49, 35, 0.95); }\n\n/* 方向键区 */\n.dirpad {\n  display: grid;\n  grid-template-areas:\n    \". up .\"\n    \"left down right\";\n  grid-template-columns: repeat(3, 72px);\n  grid-template-rows: repeat(2, 72px);\n  gap: 8px;\n  justify-content: center;\n  margin: 4px auto;\n}\n\n.dirpad .pad-btn {\n  min-width: 64px;\n  min-height: 64px;\n  padding: 0;\n  border-radius: 12px;\n  font-size: 1.6rem;\n  background: linear-gradient(180deg, var(--green-500), var(--green-700));\n  color: #fff;\n  box-shadow: 0 4px 0 var(--green-900), var(--shadow-sm);\n  border: 0;\n  cursor: pointer;\n  touch-action: manipulation;\n  user-select: none;\n  -webkit-user-select: none;\n}\n.dirpad .pad-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-900); }\n.pad-up { grid-area: up; }\n.pad-down { grid-area: down; }\n.pad-left { grid-area: left; }\n.pad-right { grid-area: right; }\n\n/* 操作说明 */\n.help-box {\n  margin-top: 14px;\n  font-size: 0.94rem;\n  background: var(--cream);\n  color: var(--ink);\n}\n.help-box kbd {\n  display: inline-block;\n  padding: 1px 7px;\n  border-radius: 5px;\n  background: #e8e1cb;\n  border: 1px solid #b8a976;\n  box-shadow: 0 2px 0 #b3a66f;\n  font-size: 0.9em;\n  font-weight: 700;\n}\n\n/* 首页 */\n.hero {\n  margin-top: 16px;\n  padding: 26px 18px;\n  text-align: center;\n  color: var(--cream);\n}\n.hero h1 {\n  margin: 0 0 8px;\n  font-size: clamp(1.6rem, 5vw, 2.6rem);\n  letter-spacing: 8px;\n  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);\n}\n.hero p { margin: 0; font-size: 1rem; color: var(--sand-300); }\n\n.version-tag {\n  display: inline-block;\n  margin-left: 8px;\n  padding: 2px 10px;\n  border-radius: 999px;\n  background: var(--sand-400);\n  color: var(--green-900);\n  font-size: 0.8rem;\n  letter-spacing: 0;\n  vertical-align: 6px;\n}\n\n.cards {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\n  gap: 14px;\n  margin-top: 18px;\n}\n\n.card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  min-height: 168px;\n  padding: 18px;\n  border-radius: 16px;\n  color: var(--ink);\n  text-decoration: none;\n  background:\n    linear-gradient(155deg, rgba(251, 246, 233, 0.96) 0%, rgba(231, 217, 180, 0.96) 100%);\n  border: 2px solid rgba(105, 118, 58, 0.45);\n  box-shadow: var(--shadow-sm);\n  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;\n  overflow: hidden;\n}\n.card::after {\n  content: \"\";\n  position: absolute;\n  right: -28px;\n  bottom: -28px;\n  width: 100px;\n  height: 100px;\n  border-radius: 50%;\n  background: radial-gradient(circle, rgba(107, 131, 55, 0.35), transparent 70%);\n}\n.card:hover {\n  transform: translateY(-4px);\n  border-color: var(--green-500);\n  box-shadow: var(--shadow);\n}\n.card .num {\n  position: absolute;\n  top: 10px;\n  right: 12px;\n  font-size: 1.05rem;\n  font-weight: 800;\n  color: rgba(60, 79, 28, 0.45);\n}\n.card .icon { font-size: 2.4rem; line-height: 1; }\n.card h2 { margin: 0; font-size: 1.22rem; color: var(--green-900); }\n.card p { margin: 0; font-size: 0.92rem; flex: 1; }\n.card .foot {\n  font-size: 0.8rem;\n  color: #73693f;\n  border-top: 1px dashed rgba(115, 105, 63, 0.4);\n  padding-top: 7px;\n}\n\nfooter.note {\n  margin: 22px auto 4px;\n  text-align: center;\n  color: var(--sand-300);\n  font-size: 0.88rem;\n}\n\n.hidden { display: none !important; }\n\n/* 手机窄屏适配 */\n@media (max-width: 640px) {\n  .toolbar { gap: 5px; padding: 8px; }\n  .toolbar h1 { font-size: 1rem; letter-spacing: 1px; }\n  .icon-btn { width: 46px; height: 46px; min-width: 46px; min-height: 46px; }\n  .btn { padding: 9px 11px; }\n  .dirpad { grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    transition-duration: 0.01ms !important;\n  }\n}\n\n</style>\n  <style>\n    .sweep-board-wrap { width: 100%; max-width: 640px; }\n    /* 修复：.arena 是弹性布局，内部面板需撑满可用宽度，否则棋盘会被压缩到 0 宽度 */\n    .sweep-board-wrap > .board-panel,\n    .sweep-board-wrap > .panel { width: 100%; }\n    .sweep-board-wrap .mine-board { width: 100%; }\n    .board-panel {\n      padding: 10px;\n      background: #6c7a48;\n      border-radius: 12px;\n      box-shadow: inset 0 0 0 3px #4f5d31, var(--shadow);\n      touch-action: manipulation;\n    }\n    .mine-board {\n      display: grid;\n      gap: 2px;\n      background: #98a879;\n      border-radius: 8px;\n      overflow: hidden;\n    }\n    .cell {\n      aspect-ratio: 1 / 1;\n      min-width: 0;\n      padding: 0;\n      border: 0;\n      border-radius: 3px;\n      background: linear-gradient(180deg, #cfd7ad, #aeb984);\n      font-size: clamp(0.65rem, 3vw, 1rem);\n      font-weight: 900;\n      line-height: 1;\n      color: #1c2a09;\n      cursor: pointer;\n      touch-action: manipulation;\n      -webkit-user-select: none;\n      user-select: none;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n    }\n    .cell:active { filter: brightness(0.88); }\n    .cell.open { background: #efe8d2; box-shadow: inset 0 1px 2px rgba(0,0,0,0.15); }\n    .cell.flag { background: linear-gradient(180deg, #e9d39a, #d6bc7d); }\n    .cell.mine-hit { background: var(--danger); color: #fff; }\n    .cell.mine { background: #c96a55; color: #fff; }\n    .cell.wrongflag { background: #e2b9ae; color: var(--danger); }\n    .n1 { color: #1546a8; }\n    .n2 { color: #1e7a34; }\n    .n3 { color: #b13b2a; }\n    .n4 { color: #5432a8; }\n    .n5 { color: #7c2f15; }\n    .n6 { color: #1f7f84; }\n    .n7 { color: #191919; }\n    .n8 { color: #7d7d7d; }\n    .sweep-controls { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; align-items: center; }\n    .mode-switch {\n      min-height: 46px;\n      font-size: 0.95rem;\n    }\n    @media (max-width: 520px) {\n      .board-panel { padding: 5px; }\n      .mine-board { gap: 1.5px; }\n    }\n  </style>\n</head>\n<body>\n  <header class=\"toolbar\">\n    <a class=\"btn ghost\" href=\"index.html\" aria-label=\"返回主页\">← 主页</a>\n    <h1>工兵排雷</h1>\n    <button class=\"icon-btn\" id=\"btnRestart\" type=\"button\" aria-label=\"重新开始\">↻</button>\n    <button class=\"icon-btn\" id=\"btnSound\" type=\"button\" aria-label=\"音效开关\">🔇</button>\n  </header>\n\n  <main class=\"page\">\n    <section class=\"hud\" aria-label=\"游戏状态\">\n      <span class=\"chip danger\">剩余雷数 <b id=\"minesLeft\">0</b></span>\n      <span class=\"chip\">剩余格数 <b id=\"cellsLeft\">0</b></span>\n      <span class=\"chip\">用时 <b id=\"timerVal\">00:00</b></span>\n      <span class=\"chip\">难度 <b id=\"diffName\">未开始</b></span>\n    </section>\n\n    <section class=\"arena sweep-board-wrap\">\n      <div class=\"panel sweep-controls\" id=\"startPanel\">\n        <p style=\"width:100%;text-align:center;margin:0 0 4px\"><strong>选择雷区规模，首次点击后自动布雷</strong></p>\n        <button class=\"btn\" type=\"button\" data-rows=\"9\" data-cols=\"9\" data-mines=\"10\">初级 9×9 · 10 雷</button>\n        <button class=\"btn warn\" type=\"button\" data-rows=\"12\" data-cols=\"12\" data-mines=\"24\">中级 12×12 · 24 雷</button>\n        <button class=\"btn\" type=\"button\" data-rows=\"14\" data-cols=\"14\" data-mines=\"45\">高级 14×14 · 45 雷</button>\n      </div>\n      <div class=\"board-panel\">\n        <div class=\"mine-board\" id=\"board\" aria-label=\"雷区\"></div>\n      </div>\n      <div class=\"panel sweep-controls\" id=\"modePanel\">\n        <span>手机模式：</span>\n        <button class=\"btn ghost mode-switch\" id=\"modeBtn\" type=\"button\">⚑ 标雷模式</button>\n        <span id=\"modeHint\" class=\"hidden\" style=\"width:100%;text-align:center;color:#5f5533\">当前点击会标旗，再按一次切回挖掘</span>\n      </div>\n    </section>\n\n    <section class=\"panel help-box\">\n      <h3>玩法与规则</h3>\n      <p>数字表示其周围 8 格中隐藏的雷数。电脑：<strong>左键翻开</strong>、<strong>右键标旗</strong>；手机：先用「标雷模式」按钮切换，点按即标旗，也支持<strong>长按任意格子约 0.5 秒</strong>标旗，两种方式都可用。</p>\n      <p>第一次点击绝不会踩雷。排完全部无雷格即胜利；踩雷或误标导致无法继续时失败并展示完整雷区。</p>\n    </section>\n  </main>\n\n  <div class=\"modal-mask hidden\" id=\"resultMask\">\n    <section class=\"modal-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"resultTitle\">\n      <h2 class=\"big-icon\" id=\"resultIcon\">💥</h2>\n      <h2 id=\"resultTitle\">本局结束</h2>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"label\">用时</div><div class=\"value\" id=\"resultTime\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">翻开格数</div><div class=\"value\" id=\"resultOpened\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">正确标旗</div><div class=\"value\" id=\"resultFlags\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">地雷总数</div><div class=\"value\" id=\"resultMines\">0</div></div>\n      </div>\n      <div class=\"modal-body\" id=\"resultBody\"></div>\n      <div class=\"modal-actions\">\n        <button class=\"btn\" id=\"againBtn\" type=\"button\">再来一局</button>\n        <a class=\"btn ghost\" href=\"index.html\">返回主页</a>\n      </div>\n    </section>\n  </div>\n\n  <script>\n/* 公共辅助：音效开关、音效生成、最高分读写、通用轻提示 */\n(function () {\n  \"use strict\";\n\n  var STORAGE_KEY = \"mtg_sound_on\";\n  var soundOn = false;\n  var audioCtx = null;\n\n  // 兼容 file:// 下 localStorage 不可用的情况\n  function storageGet(key) {\n    try {\n      return window.localStorage.getItem(key);\n    } catch (e) {\n      return null;\n    }\n  }\n\n  function storageSet(key, value) {\n    try {\n      window.localStorage.setItem(key, value);\n    } catch (e) {\n      /* 忽略：隐私模式或 file:// 限制时仅本次会话有效 */\n    }\n  }\n\n  function ensureCtx() {\n    if (!audioCtx) {\n      var AC = window.AudioContext || window.webkitAudioContext;\n      if (AC) {\n        audioCtx = new AC();\n      }\n    }\n    if (audioCtx && audioCtx.state === \"suspended\") {\n      audioCtx.resume();\n    }\n    return audioCtx;\n  }\n\n  function tone(freq, dur, when, type, volume) {\n    var ctx = audioCtx;\n    if (!ctx) return;\n    var t0 = ctx.currentTime + (when || 0);\n    var osc = ctx.createOscillator();\n    var gain = ctx.createGain();\n    osc.type = type || \"square\";\n    osc.frequency.setValueAtTime(freq, t0);\n    gain.gain.setValueAtTime(0.0001, t0);\n    gain.gain.exponentialRampToValueAtTime(volume || 0.12, t0 + 0.012);\n    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n    osc.connect(gain);\n    gain.connect(ctx.destination);\n    osc.start(t0);\n    osc.stop(t0 + dur + 0.04);\n  }\n\n  function sfx(kind) {\n    if (!soundOn || !ensureCtx()) return;\n    switch (kind) {\n      case \"click\": tone(480, 0.07, 0, \"square\", 0.08); break;\n      case \"good\": tone(660, 0.08, 0); tone(880, 0.1, 0.09); break;\n      case \"bad\": tone(180, 0.22, 0, \"sawtooth\", 0.11); break;\n      case \"flip\": tone(700, 0.05, 0, \"triangle\", 0.08); break;\n      case \"tick\": tone(1000, 0.04, 0, \"square\", 0.05); break;\n      case \"win\":\n        tone(523, 0.1, 0);\n        tone(659, 0.1, 0.12);\n        tone(784, 0.18, 0.24);\n        break;\n      case \"lose\":\n        tone(392, 0.16, 0);\n        tone(311, 0.16, 0.16);\n        tone(233, 0.3, 0.32);\n        break;\n      case \"throw\": tone(300, 0.25, 0, \"sawtooth\", 0.07); break;\n      case \"boom\": tone(120, 0.32, 0, \"sawtooth\", 0.16); break;\n      case \"step\": tone(520, 0.05, 0, \"triangle\", 0.06); break;\n      default: tone(440, 0.08, 0);\n    }\n  }\n\n  function setSound(on, persist) {\n    soundOn = !!on;\n    v
