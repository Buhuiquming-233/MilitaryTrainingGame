ar btn = document.getElementById(\"btnSound\");\n    if (btn) {\n      btn.textContent = soundOn ? \"🔊\" : \"🔇\";\n      btn.title = soundOn ? \"音效：开（点击关闭）\" : \"音效：关（点击开启）\";\n      btn.setAttribute(\"aria-pressed\", soundOn ? \"true\" : \"false\");\n    }\n    if (persist !== false) storageSet(STORAGE_KEY, soundOn ? \"1\" : \"0\");\n  }\n\n  function toggleSound() {\n    setSound(!soundOn);\n    if (soundOn) {\n      ensureCtx();\n      sfx(\"click\");\n    }\n    return soundOn;\n  }\n\n  function bindSoundBtn() {\n    var btn = document.getElementById(\"btnSound\");\n    if (btn) {\n      btn.addEventListener(\"click\", function (ev) {\n        ev.stopPropagation();\n        toggleSound();\n      });\n    }\n    soundOn = storageGet(STORAGE_KEY) === \"1\"; // 音效总开关，默认关闭\n    setSound(soundOn, false);\n  }\n\n  function getScore(key, fallback) {\n    var raw = storageGet(key);\n    if (raw === null || raw === \"\") return fallback;\n    var n = Number(raw);\n    return isFinite(n) ? n : fallback;\n  }\n\n  function saveScore(key, value) {\n    storageSet(key, String(value));\n  }\n\n  // 浮动提示，自动消失\n  var toastTimer = null;\n  function showToast(text, kind) {\n    var old = document.querySelector(\".toast\");\n    if (old) old.remove();\n    var el = document.createElement(\"div\");\n    el.className = \"toast\" + (kind ? \" \" + kind : \"\");\n    el.setAttribute(\"role\", \"status\");\n    el.textContent = text;\n    document.body.appendChild(el);\n    if (toastTimer) clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () {\n      el.classList.add(\"hide\");\n      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);\n    }, 1300);\n  }\n\n  // 页面初始化：绑定音效按钮，并给“重新开始”按钮绑定重载\n  function initPage() {\n    bindSoundBtn();\n    var restartBtn = document.getElementById(\"btnRestart\");\n    if (restartBtn) {\n      restartBtn.title = \"重新开始\";\n      restartBtn.addEventListener(\"click\", function () {\n        sfx(\"click\");\n        window.location.reload();\n      });\n    }\n    // 给所有关闭弹窗的通用按钮绑定事件（data-close-modal）\n    var closers = document.querySelectorAll(\"[data-close-modal]\");\n    for (var i = 0; i < closers.length; i++) {\n      closers[i].addEventListener(\"click\", function () {\n        var mask = document.querySelector(\".modal-mask:not(.hidden)\");\n        if (mask) mask.classList.add(\"hidden\");\n      });\n    }\n  }\n\n  function openModal(maskEl) {\n    if (maskEl) maskEl.classList.remove(\"hidden\");\n  }\n\n  function closeModal(maskEl) {\n    if (maskEl) maskEl.classList.add(\"hidden\");\n  }\n\n  // 暴露到全局\n  window.MTG = {\n    sfx: sfx,\n    setSound: setSound,\n    toggleSound: toggleSound,\n    getScore: getScore,\n    saveScore: saveScore,\n    showToast: showToast,\n    initPage: initPage,\n    openModal: openModal,\n    closeModal: closeModal\n  };\n})();\n\n<\/script>\n  <script>\n    (function () {\n      \"use strict\";\n      MTG.initPage();\n\n      var boardEl = document.getElementById(\"board\");\n      var ROWS = 0, COLS = 0, MINE_COUNT = 0;\n      var grid = [];          // 每格数据 {mine,adj,open,flag}\n      var state = \"setup\";    // setup / playing / win / lose\n      var started = false;\n      var revealedTotal = 0;\n      var correctFlags = 0;\n      var wrongFlags = 0;\n      var timerId = null, startAt = 0, elapsed = 0;\n      var flagMode = false;\n\n      var modeBtn = document.getElementById(\"modeBtn\");\n      var minesLeftEl = document.getElementById(\"minesLeft\");\n      var cellsLeftEl = document.getElementById(\"cellsLeft\");\n      var timerEl = document.getElementById(\"timerVal\");\n      var diffEl = document.getElementById(\"diffName\");\n\n      var NUM_COLOR = { 1: \"n1\", 2: \"n2\", 3: \"n3\", 4: \"n4\", 5: \"n5\", 6: \"n6\", 7: \"n7\", 8: \"n8\" };\n\n      function fmt(sec) {\n        var m = Math.floor(sec / 60);\n        var s = sec % 60;\n        return (m < 10 ? \"0\" : \"\") + m + \":\" + (s < 10 ? \"0\" : \"\") + s;\n      }\n\n      function buildCells() {\n        boardEl.innerHTML = \"\";\n        boardEl.style.gridTemplateColumns = \"repeat(\" + COLS + \", 1fr)\";\n        grid = [];\n        for (var r = 0; r < ROWS; r++) {\n          grid.push([]);\n          for (var c = 0; c < COLS; c++) {\n            grid[r].push({ mine: false, adj: 0, open: false, flag: false });\n            var el = document.createElement(\"button\");\n            el.type = \"button\";\n            el.className = \"cell\";\n            el.dataset.r = r;\n            el.dataset.c = c;\n            el.setAttribute(\"aria-label\", \"第\" + (r + 1) + \"行第\" + (c + 1) + \"列\");\n            bindCellEvents(el);\n            boardEl.appendChild(el);\n          }\n        }\n      }\n\n      function startDifficulty(rows, cols, mines) {\n        ROWS = rows; COLS = cols; MINE_COUNT = mines;\n        state = \"playing\";\n        started = false;\n        revealedTotal = 0;\n        correctFlags = 0;\n        wrongFlags = 0;\n        elapsed = 0;\n        if (timerId) clearInterval(timerId);\n        document.getElementById(\"startPanel\").classList.add(\"hidden\");\n        diffEl.textContent = rows + \"×\" + cols;\n        buildCells();\n        updateHud();\n        // 确保棋盘显示出来并滚到可视区域\n        window.setTimeout(function () {\n          var boardPanel = document.querySelector(\".sweep-board-wrap .board-panel\");\n          if (boardPanel) boardPanel.scrollIntoView({ behavior: \"smooth\", block: \"nearest\" });\n        }, 30);\n      }\n\n      function generateMines(firstR, firstC) {\n        var excluded = {};\n        var exclusions = [];\n        for (var dr = -1; dr <= 1; dr++) {\n          for (var dc = -1; dc <= 1; dc++) {\n            var rr = firstR + dr, cc = firstC + dc;\n            if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {\n              exclusions.push(rr * COLS + cc);\n            }\n          }\n        }\n        var all = [];\n        for (var r = 0; r < ROWS; r++) {\n          for (var c = 0; c < COLS; c++) {\n            if (exclusions.indexOf(r * COLS + c) < 0) all.push(r * COLS + c);\n          }\n        }\n        // 洗牌取前 N 个作为雷位\n        for (var i = all.length - 1; i > 0; i--) {\n          var j = Math.floor(Math.random() * (i + 1));\n          var t = all[i]; all[i] = all[j]; all[j] = t;\n        }\n        for (var k = 0; k < MINE_COUNT && k < all.length; k++) {\n          var pos = all[k];\n          grid[Math.floor(pos / COLS)][pos % COLS].mine = true;\n        }\n        for (var rr2 = 0; rr2 < ROWS; rr2++) {\n          for (var cc2 = 0; cc2 < COLS; cc2++) {\n            if (!grid[rr2][cc2].mine) {\n              var n = 0;\n              for (var dr2 = -1; dr2 <= 1; dr2++) {\n                for (var dc2 = -1; dc2 <= 1; dc2++) {\n                  var ar = rr2 + dr2, ac = cc2 + dc2;\n                  if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS && grid[ar][ac].mine) n++;\n                }\n              }\n              grid[rr2][cc2].adj = n;\n            }\n          }\n        }\n      }\n\n      function cellEl(r, c) {\n        return boardEl.children[r * COLS + c];\n      }\n\n      function paint() {\n        for (var r = 0; r < ROWS; r++) {\n          for (var c = 0; c < COLS; c++) {\n            var cell = grid[r][c];\n            var el = cellEl(r, c);\n            el.className = \"cell\";\n            el.textContent = \"\";\n            if (cell.open) {\n              el.classList.add(\"open\");\n              if (cell.mine) {\n                el.classList.add(\"mine-hit\");\n                el.textContent = \"💣\";\n              } else if (cell.adj > 0) {\n                el.textContent = cell.adj;\n                el.classList.add(NUM_COLOR[cell.adj]);\n              }\n            } else {\n              if (cell.flag) {\n                el.classList.add(\"flag\");\n                el.textContent = \"🚩\";\n              }\n              if (state === \"lose\" && cell.mine) {\n                el.classList.add(\"mine\");\n                el.textContent = \"💣\";\n              }\n              if (state === \"lose\" && cell.flag && !cell.mine) {\n                el.classList.add(\"wrongflag\");\n                el.textContent = \"✕\";\n              }\n            }\n          }\n        }\n      }\n\n      function updateHud() {\n        var flagged = correctFlags + wrongFlags;\n        minesLeftEl.textContent = Math.max(0, MINE_COUNT - correctFlags);\n        cellsLeftEl.textContent = Math.max(0, ROWS * COLS - revealedTotal - flagged);\n        timerEl.textContent = fmt(elapsed);\n      }\n\n      function openArea(r, c, chain) {\n        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;\n        var cell = grid[r][c];\n        var el = cellEl(r, c);\n        if (cell.open || cell.flag) return;\n        cell.open = true;\n        revealedTotal += 1;\n        el.classList.add(\"open\");\n        if (!chain) MTG.sfx(\"click\");\n        if (cell.mine) return;\n        if (cell.adj === 0) {\n          for (var dr = -1; dr <= 1; dr++) {\n            for (var dc = -1; dc <= 1; dc++) {\n              if (dr !== 0 || dc !== 0) openArea(r + dr, c + dc, true);\n            }\n          }\n        }\n      }\n\n      function revealAllMines(hitR, hitC) {\n        state = \"lose\";\n        for (var r = 0; r < ROWS; r++) {\n          for (var c = 0; c < COLS; c++) {\n            var cell = grid[r][c];\n            if (cell.mine && !cell.flag) {\n              cell.open = true;\n              revealedTotal += 1;\n            }\n          }\n        }\n        if (hitR >= 0) cellEl(hitR, hitC).classList.add(\"mine-hit\");\n        stopTimer();\n        paint();\n        updateHud();\n        endGame(false);\n      }\n\n      function checkWin() {\n        if (revealedTotal === ROWS * COLS - MINE_COUNT) {\n          state = \"win\";\n          stopTimer();\n          paint();\n          updateHud();\n          endGame(true);\n          return true;\n        }\n        return false;\n      }\n\n      function handleReveal(r, c) {\n        if (state !== \"playing\") return;\n        var cell = grid[r][c];\n        if (cell.open || cell.flag) return;\n        if (!started) {\n          started = true;\n          startAt = Date.now();\n          generateMines(r, c);\n          timerId = setInterval(function () {\n            if (state === \"playing\") {\n              elapsed = Math.floor((Date.now() - startAt) / 1000);\n              timerEl.textContent = fmt(elapsed);\n            }\n          }, 250);\n        }\n        openArea(r, c, false);\n        if (cell.mine) {\n          revealAllMines(r, c);\n          return;\n        }\n        paint();           // 翻开后立即补画数字/颜色，避免只有标旗时才刷新\n        updateHud();\n        checkWin();\n      }\n\n      function handleFlag(r, c) {\n        if (state !== \"playing\") return;\n        var cell = grid[r][c];\n        if (cell.open) return;\n        if (cell.flag) {\n          cell.flag = false;\n          if (cell.mine) correctFlags -= 1; else wrongFlags -= 1;\n          MTG.sfx(\"click\");\n        } else {\n          cell.flag = true;\n          if (cell.mine) correctFlags += 1; else wrongFlags += 1;\n          MTG.sfx(\"flip\");\n        }\n        paint();\n        updateHud();\n        // 若所有雷都正确标出且其余全部翻开，也判胜\n        if (correctFlags === MINE_COUNT) checkWin();\n      }\n\n      function bindCellEvents(el) {\n        var longTimer = null;\n        var longDone = false;\n        el.addEventListener(\"contextmenu\", function (ev) {\n          ev.preventDefault();\n          if (state === \"playing\") {\n            handleFlag(Number(el.dataset.r), Number(el.dataset.c));\n          }\n        });\n        el.addEventListener(\"pointerdown\", function (ev) {\n          if (ev.button !== undefined && ev.button !== 0) return;\n          longDone = false;\n          longTimer = setTimeout(function () {\n            longDone = true;\n            handleFlag(Number(el.dataset.r), Number(el.dataset.c));\n          }, 500);\n        });\n        el.addEventListener(\"pointerup\", function () {\n          if (longTimer) { clearTimeout(longTimer); longTimer = null; }\n        });\n        el.addEventListener(\"pointerleave\", function () {\n          if (longTimer) { clearTimeout(longTimer); longTimer = null; }\n        });\n        el.addEventListener(\"pointercancel\", function () {\n          if (longTimer) { clearTimeout(longTimer); longTimer = null; }\n        });\n        el.addEventListener(\"click\", function () {\n          if (longDone) { longDone = false; return; }\n          var r = Number(el.dataset.r), c = Number(el.dataset.c);\n          if (state !== \"playing\") return;\n          if (flagMode) handleFlag(r, c); else handleReveal(r, c);\n        });\n      }\n\n      function stopTimer() {\n        if (timerId) { clearInterval(timerId); timerId = null; }\n      }\n\n      function endGame(win) {\n        document.getElementById(\"resultIcon\").textContent = win ? \"🎖️\" : \"💥\";\n        document.getElementById(\"resultTitle\").textContent = win ? \"雷区安全清除！\" : \"踩雷！排雷任务失败\";\n        document.getElementById(\"resultTime\").textContent = fmt(elapsed);\n        document.getElementById(\"resultOpened\").textContent = revealedTotal;\n        document.getElementById(\"resultFlags\").textContent = correctFlags + \" / \" + MINE_COUNT;\n        document.getElementById(\"resultMines\").textContent = MINE_COUNT;\n        document.getElementById(\"resultBody\").textContent = win\n          ? \"所有安全格已确认，本次雷区成功清除。\"\n          : \"红格是踩中的雷，其余标红为实际雷位。观察数字再试一次，第一次点开的位置是绝对安全的。\";\n        MTG.openModal(document.getElementById(\"resultMask\"));\n        MTG.sfx(win ? \"win\" : \"lose\");\n      }\n\n      var startBtns = document.querySelectorAll(\"#startPanel [data-rows]\");\n      for (var i = 0; i < startBtns.length; i++) {\n        startBtns[i].addEventListener(\"click\", function () {\n          MTG.sfx(\"click\");\n          startDifficulty(\n            Number(this.getAttribute(\"data-rows\")),\n            Number(this.getAttribute(\"data-cols\")),\n            Number(this.getAttribute(\"data-mines\"))\n          );\n        });\n      }\n\n      modeBtn.addEventListener(\"click\", function () {\n        flagMode = !flagMode;\n        modeBtn.textContent = flagMode ? \"⛏ 挖掘模式\" : \"⚑ 标雷模式\";\n        var hint = document.getElementById(\"modeHint\");\n        if (flagMode) {\n          hint.textContent = \"当前为标雷模式：点按任意格子标旗，长按也能标旗；再按按钮切回挖掘\";\n          hint.classList.remove(\"hidden\");\n        } else {\n          hint.textContent = \"当前为挖掘模式：点按格子翻开（也可以长按标旗）\";\n          hint.classList.remove(\"hidden\");\n        }\n        MTG.showToast(flagMode ? \"已切换：点按格子会标旗\" : \"已切换：点按格子会翻开\", \"\");\n        MTG.sfx(\"click\");\n      });\n\n      document.getElementById(\"againBtn\").addEventListener(\"click\", function () {\n        window.location.reload();\n      });\n\n      // 初始展示一个 9×9 空棋盘，未开始\n      ROWS = 9; COLS = 9; MINE_COUNT = 10;\n      diffEl.textContent = \"请选择\";\n      buildCells();\n      updateHud();\n    })();\n  <\/script>\n<script>\n(function () {\n  \"use strict\";\n  function goHome() {\n    try { if (window.parent && window.parent !== window) window.parent.postMessage({ mtgCmd: \"home\" }, \"*\"); } catch (e) {}\n  }\n  document.addEventListener(\"click\", function (ev) {\n    var n = ev.target;\n    while (n && n !== document && !(n.tagName && n.tagName.toLowerCase() === \"a\")) n = n.parentNode;\n    if (n && n.getAttribute && /(^|\\/)index\\.html(#.*)?$/i.test(n.getAttribute(\"href\") || \"\")) {\n      ev.preventDefault(); ev.stopPropagation(); goHome();\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n",
  "snake": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n  <title>边境巡逻蛇 - 军训小游戏</title>\n  <style>\n:root {\n  --green-900: #27360f;\n  --green-700: #3c4f1c;\n  --green-600: #4f6528;\n  --green-500: #6b8337;\n  --green-300: #a8b878;\n  --sand-300: #e7d9b4;\n  --sand-400: #d7c08d;\n  --cream: #fbf6e9;\n  --ink: #2b2a19;\n  --danger: #a63a2b;\n  --warn: #c07f13;\n  --ok: #3f7d32;\n  --radius: 14px;\n  --shadow: 0 8px 22px rgba(30, 40, 10, 0.28);\n  --shadow-sm: 0 3px 9px rgba(30, 40, 10, 0.2);\n}\n\n* { box-sizing: border-box; }\n\nhtml, body { margin: 0; padding: 0; }\n\nbody {\n  min-height: 100vh;\n  color: var(--ink);\n  font-family: \"Microsoft YaHei\", \"PingFang SC\", \"Segoe UI\", system-ui, sans-serif;\n  background-color: #46552a;\n  background-image:\n    radial-gradient(circle at 18% 22%, rgba(107, 131, 55, 0.85) 0 48px, transparent 48px),\n    radial-gradient(circle at 72% 70%, rgba(38, 54, 15, 0.75) 0 70px, transparent 70px),\n    radial-gradient(circle at 55% 28%, rgba(137, 154, 93, 0.5) 0 46px, transparent 46px),\n    radial-gradient(circle at 30% 82%, rgba(60, 79, 28, 0.9) 0 60px, transparent 60px),\n    linear-gradient(135deg, #3f4f25 0%, #55682f 55%, #39491f 100%);\n  line-height: 1.6;\n  -webkit-tap-highlight-color: transparent;\n}\n\nbutton { font-family: inherit; }\n\n.page {\n  width: 100%;\n  max-width: 1080px;\n  margin: 0 auto;\n  padding: 12px 12px 28px;\n}\n\n/* 顶部工具条 */\n.toolbar {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 12px;\n  background: rgba(43, 59, 22, 0.92);\n  border: 2px solid rgba(231, 217, 180, 0.35);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-sm);\n  color: var(--cream);\n}\n\n.toolbar h1 {\n  flex: 1;\n  margin: 0 8px;\n  font-size: 1.2rem;\n  letter-spacing: 2px;\n  text-align: center;\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  min-width: 48px;\n  min-height: 44px;\n  padding: 9px 16px;\n  border: 0;\n  border-radius: 10px;\n  font-size: 1rem;\n  font-weight: 700;\n  color: var(--cream);\n  background: linear-gradient(180deg, var(--green-500), var(--green-700));\n  box-shadow: 0 3px 0 var(--green-900), var(--shadow-sm);\n  cursor: pointer;\n  text-decoration: none;\n  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;\n  touch-action: manipulation;\n  user-select: none;\n  -webkit-user-select: none;\n}\n\n.btn:hover { filter: brightness(1.12); }\n.btn:active {\n  transform: translateY(2px);\n  box-shadow: 0 1px 0 var(--green-900);\n}\n\n.btn.ghost {\n  color: var(--green-900);\n  background: linear-gradient(180deg, var(--sand-300), var(--sand-400));\n  box-shadow: 0 3px 0 #9b8754;\n}\n\n.btn.warn {\n  background: linear-gradient(180deg, #c98325, #9a5d12);\n  box-shadow: 0 3px 0 #5f3a0a;\n}\n\n.btn:disabled {\n  filter: grayscale(0.75);\n  opacity: 0.55;\n  cursor: not-allowed;\n  transform: none;\n}\n\n.icon-btn {\n  width: 46px;\n  height: 46px;\n  min-width: 46px;\n  min-height: 46px;\n  padding: 0;\n  font-size: 1.25rem;\n  border-radius: 50%;\n}\n\n/* 通用面板 */\n.panel {\n  margin-top: 14px;\n  padding: 14px 16px;\n  border-radius: var(--radius);\n  background: var(--cream);\n  box-shadow: var(--shadow);\n  border: 1px solid rgba(88, 73, 33, 0.25);\n}\n\n.panel h2, .panel h3 {\n  margin: 0 0 6px;\n  color: var(--green-900);\n}\n\n.panel p { margin: 6px 0; }\n\n/* 状态栏 */\n.hud {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-top: 14px;\n  justify-content: center;\n}\n\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  padding: 7px 13px;\n  border-radius: 999px;\n  background: var(--cream);\n  border: 2px solid var(--sand-400);\n  box-shadow: var(--shadow-sm);\n  font-weight: 700;\n  white-space: nowrap;\n}\n\n.chip b { color: var(--green-700); font-size: 1.05em; }\n.chip.danger b { color: var(--danger); }\n.chip.ok b { color: var(--ok); }\n\n/* 主舞台 */\n.arena {\n  margin-top: 14px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 14px;\n}\n\n.stage-box {\n  width: 100%;\n  max-width: 860px;\n  border-radius: var(--radius);\n  background: var(--cream);\n  box-shadow: var(--shadow);\n  border: 1px solid rgba(88, 73, 33, 0.25);\n  overflow: hidden;\n}\n\n/* 弹窗 */\n.modal-mask {\n  position: fixed;\n  inset: 0;\n  z-index: 90;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 18px;\n  background: rgba(18, 25, 8, 0.68);\n  backdrop-filter: blur(2px);\n}\n\n.modal-card {\n  width: 100%;\n  max-width: 460px;\n  max-height: 86vh;\n  overflow: auto;\n  padding: 22px;\n  border-radius: 18px;\n  background:\n    linear-gradient(180deg, rgba(251, 246, 233, 0.97), rgba(235, 221, 186, 0.98));\n  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);\n  border: 3px solid var(--green-600);\n  text-align: center;\n  color: var(--ink);\n}\n\n.modal-card h2 {\n  margin: 0 0 8px;\n  font-size: 1.45rem;\n  color: var(--green-900);\n}\n\n.modal-card h2.big-icon { font-size: 2.6rem; }\n.modal-body { margin: 8px 0 16px; font-size: 1.02rem; }\n.modal-actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n.modal-actions .btn { min-width: 130px; }\n\n.stat-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 8px;\n  margin: 10px 0;\n}\n.stat-grid .stat {\n  padding: 9px 6px;\n  border-radius: 10px;\n  background: rgba(216, 194, 141, 0.35);\n  border: 1px solid rgba(120, 100, 45, 0.25);\n}\n.stat .label { font-size: 0.86rem; color: #665c3c; }\n.stat .value { font-size: 1.25rem; font-weight: 800; color: var(--green-900); }\n.stat .value.danger { color: var(--danger); }\n.stat .value.ok { color: var(--ok); }\n\n/* 轻提示 */\n.toast {\n  position: fixed;\n  left: 50%;\n  top: 16%;\n  z-index: 80;\n  transform: translateX(-50%);\n  padding: 10px 20px;\n  border-radius: 999px;\n  font-size: 1.05rem;\n  font-weight: 800;\n  color: #fff;\n  background: rgba(39, 54, 15, 0.92);\n  box-shadow: var(--shadow);\n  pointer-events: none;\n  text-align: center;\n  max-width: 88vw;\n  transition: opacity 0.25s ease;\n}\n.toast.hide { opacity: 0; }\n.toast.good { background: rgba(47, 103, 36, 0.94); }\n.toast.bad { background: rgba(160, 49, 35, 0.95); }\n\n/* 方向键区 */\n.dirpad {\n  display: grid;\n  grid-template-areas:\n    \". up .\"\n    \"left down right\";\n  grid-template-columns: repeat(3, 72px);\n  grid-template-rows: repeat(2, 72px);\n  gap: 8px;\n  justify-content: center;\n  margin: 4px auto;\n}\n\n.dirpad .pad-btn {\n  min-width: 64px;\n  min-height: 64px;\n  padding: 0;\n  border-radius: 12px;\n  font-size: 1.6rem;\n  background: linear-gradient(180deg, var(--green-500), var(--green-700));\n  color: #fff;\n  box-shadow: 0 4px 0 var(--green-900), var(--shadow-sm);\n  border: 0;\n  cursor: pointer;\n  touch-action: manipulation;\n  user-select: none;\n  -webkit-user-select: none;\n}\n.dirpad .pad-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-900); }\n.pad-up { grid-area: up; }\n.pad-down { grid-area: down; }\n.pad-left { grid-area: left; }\n.pad-right { grid-area: right; }\n\n/* 操作说明 */\n.help-box {\n  margin-top: 14px;\n  font-size: 0.94rem;\n  background: var(--cream);\n  color: var(--ink);\n}\n.help-box kbd {\n  display: inline-block;\n  padding: 1px 7px;\n  border-radius: 5px;\n  background: #e8e1cb;\n  border: 1px solid #b8a976;\n  box-shadow: 0 2px 0 #b3a66f;\n  font-size: 0.9em;\n  font-weight: 700;\n}\n\n/* 首页 */\n.hero {\n  margin-top: 16px;\n  padding: 26px 18px;\n  text-align: center;\n  color: var(--cream);\n}\n.hero h1 {\n  margin: 0 0 8px;\n  font-size: clamp(1.6rem, 5vw, 2.6rem);\n  letter-spacing: 8px;\n  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);\n}\n.hero p { margin: 0; font-size: 1rem; color: var(--sand-300); }\n\n.version-tag {\n  display: inline-block;\n  margin-left: 8px;\n  padding: 2px 10px;\n  border-radius: 999px;\n  background: var(--sand-400);\n  color: var(--green-900);\n  font-size: 0.8rem;\n  letter-spacing: 0;\n  vertical-align: 6px;\n}\n\n.cards {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\n  gap: 14px;\n  margin-top: 18px;\n}\n\n.card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  min-height: 168px;\n  padding: 18px;\n  border-radius: 16px;\n  color: var(--ink);\n  text-decoration: none;\n  background:\n    linear-gradient(155deg, rgba(251, 246, 233, 0.96) 0%, rgba(231, 217, 180, 0.96) 100%);\n  border: 2px solid rgba(105, 118, 58, 0.45);\n  box-shadow: var(--shadow-sm);\n  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;\n  overflow: hidden;\n}\n.card::after {\n  content: \"\";\n  position: absolute;\n  right: -28px;\n  bottom: -28px;\n  width: 100px;\n  height: 100px;\n  border-radius: 50%;\n  background: radial-gradient(circle, rgba(107, 131, 55, 0.35), transparent 70%);\n}\n.card:hover {\n  transform: translateY(-4px);\n  border-color: var(--green-500);\n  box-shadow: var(--shadow);\n}\n.card .num {\n  position: absolute;\n  top: 10px;\n  right: 12px;\n  font-size: 1.05rem;\n  font-weight: 800;\n  color: rgba(60, 79, 28, 0.45);\n}\n.card .icon { font-size: 2.4rem; line-height: 1; }\n.card h2 { margin: 0; font-size: 1.22rem; color: var(--green-900); }\n.card p { margin: 0; font-size: 0.92rem; flex: 1; }\n.card .foot {\n  font-size: 0.8rem;\n  color: #73693f;\n  border-top: 1px dashed rgba(115, 105, 63, 0.4);\n  padding-top: 7px;\n}\n\nfooter.note {\n  margin: 22px auto 4px;\n  text-align: center;\n  color: var(--sand-300);\n  font-size: 0.88rem;\n}\n\n.hidden { display: none !important; }\n\n/* 手机窄屏适配 */\n@media (max-width: 640px) {\n  .toolbar { gap: 5px; padding: 8px; }\n  .toolbar h1 { font-size: 1rem; letter-spacing: 1px; }\n  .icon-btn { width: 46px; height: 46px; min-width: 46px; min-height: 46px; }\n  .btn { padding: 9px 11px; }\n  .dirpad { grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    transition-duration: 0.01ms !important;\n  }\n}\n\n</style>\n  <style>\n    .snake-stage {\n      position: relative;\n      width: 100%;\n      max-width: 700px;\n      touch-action: none;\n      cursor: pointer;\n    }\n    .snake-stage canvas {\n      display: block;\n      width: 100%;\n      height: auto;\n      background: #e8e1c8;\n      border-radius: 10px;\n      box-shadow: inset 0 0 0 2px #a89a66;\n    }\n    .snake-cover {\n      position: absolute;\n      inset: 0;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      gap: 8px;\n      background: rgba(29, 39, 14, 0.72);\n      color: #fff;\n      border-radius: 10px;\n      text-align: center;\n      padding: 14px;\n    }\n    .snake-cover h3 { margin: 0; font-size: 1.35rem; }\n    .snake-cover p { margin: 0; font-size: 0.92rem; color: #e6d9b8; max-width: 420px; }\n    .snake-page .page { padding-bottom: 26px; }\n  </style>\n</head>\n<body class=\"snake-page\">\n  <header class=\"toolbar\">\n    <a class=\"btn ghost\" href=\"index.html\" aria-label=\"返回主页\">← 主页</a>\n    <h1>边境巡逻蛇</h1>\n    <button class=\"icon-btn\" id=\"btnRestart\" type=\"button\" aria-label=\"重新开始\">↻</button>\n    <button class=\"icon-btn\" id=\"btnSound\" type=\"button\" aria-label=\"音效开关\">🔇</button>\n  </header>\n\n  <main class=\"page\">\n    <section class=\"hud\" aria-label=\"游戏状态\">\n      <span class=\"chip\">得分 <b id=\"score\">0</b></span>\n      <span class=\"chip\">长度 <b id=\"length\">4</b></span>\n      <span class=\"chip ok\">最高分 <b id=\"best\">0</b></span>\n      <span class=\"chip\">状态 <b id=\"stateText\">待开始</b></span>\n    </section>\n\n    <section class=\"arena\">\n      <div class=\"snake-stage\" id=\"stage\">\n        <canvas id=\"gameCanvas\" width=\"800\" height=\"560\" aria-label=\"边境网格\"></canvas>\n        <div class=\"snake-cover\" id=\"cover\">\n          <h3>🚜 边境巡逻任务</h3>\n          <p>用方向键 / WASD 或滑动控制巡逻小队，吃补给箱增长；撞到边界或自己都会任务失败。</p>\n          <button class=\"btn\" id=\"btnStart\" type=\"button\">▶ 开始巡逻</button>\n        </div>\n      </div>\n\n      <div class=\"panel snake-controls\" style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:700px;margin-top:0\">\n        <button class=\"btn\" id=\"pauseBtn\" type=\"button\" disabled>⏸ 暂停</button>\n        <span style=\"font-size:0.9rem;color:#6a5f3b\">速度随长度提升，空格 / P 可暂停继续</span>\n      </div>\n\n      <div class=\"dirpad\" aria-label=\"方向按键\">\n        <button class=\"pad-btn pad-up\" type=\"button\" data-dir=\"up\" aria-label=\"上\">▲</button>\n        <button class=\"pad-btn pad-left\" type=\"button\" data-dir=\"left\" aria-label=\"左\">◀</button>\n        <button class=\"pad-btn pad-down\" type=\"button\" data-dir=\"down\" aria-label=\"下\">▼</button>\n        <button class=\"pad-btn pad-right\" type=\"button\" data-dir=\"right\" aria-label=\"右\">▶</button>\n      </div>\n    </section>\n\n    <section class=\"panel help-box\">\n      <h3>玩法与规则</h3>\n      <p>电脑：<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 或 <kbd>WASD</kbd>；手机：在网格内滑动控制，或用下方方向按钮，随时可按「暂停」。</p>\n      <p>场地内没有障碍物，专心控制方向即可；长度达到一定数值后速度会提升。刷新最高分会自动保存在本机。</p>\n    </section>\n  </main>\n\n  <div class=\"modal-mask hidden\" id=\"resultMask\">\n    <section class=\"modal-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"resultTitle\">\n      <h2 class=\"big-icon\" id=\"resultIcon\">💥</h2>\n      <h2 id=\"resultTitle\">巡逻失败</h2>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"label\">本局得分</div><div class=\"value\" id=\"resultScore\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">巡逻长度</div><div class=\"value\" id=\"resultLength\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">补给点</div><div class=\"value\" id=\"resultFood\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">历史最高</div><div class=\"value\" id=\"resultBest\">0</div></div>\n      </div>\n      <div class=\"modal-body\" id=\"resultBody\"></div>\n      <div class=\"modal-actions\">\n        <button class=\"btn\" id=\"againBtn\" type=\"button\">再来一局</button>\n        <a class=\"btn ghost\" href=\"index.html\">返回主页</a>\n      </div>\n    </section>\n  </div>\n\n  <script>\n/* 公共辅助：音效开关、音效生成、最高分读写、通用轻提示 */\n(function () {\n  \"use strict\";\n\n  var STORAGE_KEY = \"mtg_sound_on\";\n  var soundOn = false;\n  var audioCtx = null;\n\n  // 兼容 file:// 下 localStorage 不可用的情况\n  function storageGet(key) {\n    try {\n      return window.localStorage.getItem(key);\n    } catch (e) {\n      return null;\n    }\n  }\n\n  function storageSet(key, value) {\n    try {\n      window.localStorage.setItem(key, value);\n    } catch (e) {\n      /* 忽略：隐私模式或 file:// 限制时仅本次会话有效 */\n    }\n  }\n\n  function ensureCtx() {\n    if (!audioCtx) {\n      var AC = window.AudioContext || window.webkitAudioContext;\n      if (AC) {\n        audioCtx = new AC();\n      }\n    }\n    if (audioCtx && audioCtx.state === \"suspended\") {\n      audioCtx.resume();\n    }\n    return audioCtx;\n  }\n\n  function tone(freq, dur, when, type, volume) {\n    var ctx = audioCtx;\n    if (!ctx) return;\n    var t0 = ctx.currentTime + (when || 0);\n    var osc = ctx.createOscillator();\n    var gain = ctx.createGain();\n    osc.type = type || \"square\";\n    osc.frequency.setValueAtTime(freq, t0);\n    gain.gain.setValueAtTime(0.0001, t0);\n    gain.gain.exponentialRampToValueAtTime(volume || 0.12, t0 + 0.012);\n    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n    osc.connect(gain);\n    gain.connect(ctx.destination);\n    osc.start(t0);\n    osc.stop(t0 + dur + 0.04);\n  }\n\n  function sfx(kind) {\n    if (!soundOn || !ensureCtx()) return;\n    switch (kind) {\n      case \"click\": tone(480, 0.07, 0, \"square\", 0.08); break;\n      case \"good\": tone(660, 0.08, 0); tone(880, 0.1, 0.09); break;\n      case \"bad\": tone(180, 0.22, 0, \"sawtooth\", 0.11); break;\n      case \"flip\": tone(700, 0.05, 0, \"triangle\", 0.08); break;\n      case \"tick\": tone(1000, 0.04, 0, \"square\", 0.05); break;\n      case \"win\":\n        tone(523, 0.1, 0);\n        tone(659, 0.1, 0.12);\n        tone(784, 0.18, 0.24);\n        break;\n      case \"lose\":\n        tone(392, 0.16, 0);\n        tone(311, 0.16, 0.16);\n        tone(233, 0.3, 0.32);\n        break;\n      case \"throw\": tone(300, 0.25, 0, \"sawtooth\", 0.07); break;\n      case \"boom\": tone(120, 0.32, 0, \"sawtooth\", 0.16); break;\n      case \"step\": tone(520, 0.05, 0, \"triangle\", 0.06); break;\n      default: tone(440, 0.08, 0);\n    }\n  }\n\n  function setSound(on, persist) {\n    soundOn = !!on;\n    var btn = document.getElementById(\"btnSound\");\n    if (btn) {\n      btn.textContent = soundOn ? \"🔊\" : \"🔇\";\n      btn.title = soundOn ? \"音效：开（点击关闭）\" : \"音效：关（点击开启）\";\n      btn.setAttribute(\"aria-pressed\", soundOn ? \"true\" : \"false\");\n    }\n    if (persist !== false) storageSet(STORAGE_KEY, soundOn ? \"1\" : \"0\");\n  }\n\n  function toggleSound() {\n    setSound(!soundOn);\n    if (soundOn) {\n      ensureCtx();\n      sfx(\"click\");\n    }\n    return soundOn;\n  }\n\n  function bindSoundBtn() {\n    var btn = document.getElementById(\"btnSound\");\n    if (btn) {\n      btn.addEventListener(\"click\", function (ev) {\n        ev.stopPropagation();\n        toggleSound();\n      });\n    }\n    soundOn = storageGet(STORAGE_KEY) === \"1\"; // 音效总开关，默认关闭\n    setSound(soundOn, false);\n  }\n\n  function getScore(key, fallback) {\n    var raw = storageGet(key);\n    if (raw === null || raw === \"\") return fallback;\n    var n = Number(raw);\n    return isFinite(n) ? n : fallback;\n  }\n\n  function saveScore(key, value) {\n    storageSet(key, String(value));\n  }\n\n  // 浮动提示，自动消失\n  var toastTimer = null;\n  function showToast(text, kind) {\n    var old = document.querySelector(\".toast\");\n    if (old) old.remove();\n    var el = document.createElement(\"div\");\n    el.className = \"toast\" + (kind ? \" \" + kind : \"\");\n    el.setAttribute(\"role\", \"status\");\n    el.textContent = text;\n    document.body.appendChild(el);\n    if (toastTimer) clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () {\n      el.classList.add(\"hide\");\n      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);\n    }, 1300);\n  }\n\n  // 页面初始化：绑定音效按钮，并给“重新开始”按钮绑定重载\n  function initPage() {\n    bindSoundBtn();\n    var restartBtn = document.getElementById(\"btnRestart\");\n    if (restartBtn) {\n      restartBtn.title = \"重新开始\";\n      restartBtn.addEventListener(\"click\", function () {\n        sfx(\"click\");\n        window.location.reload();\n      });\n    }\n    // 给所有关闭弹窗的通用按钮绑定事件（data-close-modal）\n    var closers = document.querySelectorAll(\"[data-close-modal]\");\n    for (var i = 0; i < closers.length; i++) {\n      closers[i].addEventListener(\"click\", function () {\n        var mask = document.querySelector(\".modal-mask:not(.hidden)\");\n        if (mask) mask.classList.add(\"hidden\");\n      });\n    }\n  }\n\n  function openModal(maskEl) {\n    if (maskEl) maskEl.classList.remove(\"hidden\");\n  }\n\n  function closeModal(maskEl) {\n    if (maskEl) maskEl.classList.add(\"hidden\");\n  }\n\n  // 暴露到全局\n  window.MTG = {\n    sfx: sfx,\n    setSound: setSound,\n    toggleSound: toggleSound,\n    getScore: getScore,\n    saveScore: saveScore,\n    showToast: showToast,\n    initPage: initPage,\n    openModal: openModal,\n    closeModal: closeModal\n  };\n})();\n\n<\/script>\n  <script>\n    (function () {\n      \"use strict\";\n      MTG.initPage();\n\n      var COLS = 20, ROWS = 14;\n      var CELL = 40;\n      var canvas = document.getElementById(\"gameCanvas\");\n      var ctx = canvas.getContext(\"2d\");\n      var BEST_KEY = \"mtg_snake_best\";\n      var best = MTG.getScore(BEST_KEY, 0);\n\n      var state = \"idle\";        // idle / running / paused / over\n      var snake = [];            // 尾→头\n      var dir = { x: 1, y: 0 };\n      var dirQueue = [];\n      var food = null;\n      var score = 0, foods = 0;\n      var stepMs = 195;\n      var stepTimer = null;\n      var canEat = false;\n      var startBtn = document.getElementById(\"btnStart\");\n      var pauseBtn = document.getElementById(\"pauseBtn\");\n\n      var scoreEl = document.getElementById(\"score\");\n      var lengthEl = document.getElementById(\"length\");\n      var bestEl = document.getElementById(\"best\");\n      var stateText = document.getElementById(\"stateText\");\n\n      bestEl.textContent = best;\n\n      function emptyList() {\n        var used = {};\n        snake.forEach(function (s) { used[s.r + \"_\" + s.c] = true; });\n        if (food) used[food.r + \"_\" + food.c] = true;\n        return used;\n      }\n\n      function makeFood() {\n        var used = emptyList();\n        var options = [];\n        for (var r = 0; r < ROWS; r++) {\n          for (var c = 0; c < COLS; c++) {\n            if (!used[r + \"_\" + c]) options.push({ r: r, c: c });\n          }\n        }\n        if (options.length === 0) { state = \"over\"; gameOver(\"地图已满，补给完成！\", true); return; }\n        food = options[Math.floor(Math.random() * options.length)];\n      }\n\n      function resetGame() {\n        snake = [];\n        for (var i = 0; i < 4; i++) snake.push({ r: 7, c: 6 + i });\n        dir = { x: 1, y: 0 };\n        dirQueue = [];\n        food = null;\n        score = 0;\n        foods = 0;\n        stepMs = 195;\n        makeFood();\n        updateHud();\n        draw();\n      }\n\n      function updateHud() {\n        scoreEl.textContent = score;\n        lengthEl.textContent = snake.length;\n        bestEl.textContent = Math.max(best, score);\n        stateText.textContent = state === \"running\" ? \"巡逻中\" : state === \"paused\" ? \"已暂停\" : state === \"over\" ? \"已结束\" : \"待开始\";\n      }\n\n      function draw() {\n        ctx.clearRect(0, 0, canvas.width, canvas.height);\n        // 背景网格\n        for (var r = 0; r < ROWS; r++) {\n          for (var c = 0; c < COLS; c++) {\n            ctx.fillStyle = (r + c) % 2 === 0 ? \"#e6dfc5\" : \"#ded3ae\";\n            ctx.fillRect(c * CELL, r * CELL, CELL, CELL);\n          }\n        }\n        // 补给点\n        if (food) {\n          var fx = food.c * CELL, fy = food.r * CELL;\n          ctx.fillStyle = \"#f5f0dd\";\n          ctx.fillRect(fx + 5, fy + 5, CELL - 10, CELL - 10);\n          ctx.fillStyle = \"#c0392b\";\n          ctx.fillRect(fx + CELL / 2 - 2, fy + 7, 4, CELL - 14);\n          ctx.fillRect(fx + 7, fy + CELL / 2 - 2, CELL - 14, 4);\n        }\n        // 巡逻小队\n        for (var i = 0; i < snake.length; i++) {\n          var sx = snake[i].c * CELL, sy = snake[i].r * CELL;\n          var isHead = i === snake.length - 1;\n          ctx.fillStyle = isHead ? \"#3d5a1e\" : \"#55732c\";\n          var inset = isHead ? 3 : 5;\n          ctx.fillRect(sx + inset, sy + inset, CELL - inset * 2, CELL - inset * 2);\n          ctx.fillStyle = isHead ? \"#d7c08d\" : \"#8aa561\";\n          if (isHead) {\n            ctx.beginPath();\n            ctx.arc(sx + CELL / 2, sy + CELL / 2, 5, 0, Math.PI * 2);\n            ctx.fill();\n          }\n        }\n      }\n\n      function step() {\n        if (state !== \"running\") return;\n        if (dirQueue.length > 0) dir = dirQueue.shift();\n        var head = snake[snake.length - 1];\n        var nr = head.r + dir.y;\n        var nc = head.c + dir.x;\n        // 边界\n        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) {\n          gameOver(\"巡逻队撞上了边境围栏。\", false);\n          return;\n        }\n        // 自撞（尾巴将移动时除外）\n        for (var j = 0; j < snake.length - 1; j++) {\n          if (snake[j].r === nr && snake[j].c === nc) {\n            gameOver(\"巡逻队自己人挤在一起，队形混乱。\", false);\n            return;\n          }\n        }\n        snake.push({ r: nr, c: nc });\n        if (food && food.r === nr && food.c === nc) {\n          foods += 1;\n          score += 10;\n          canEat = true;\n          MTG.sfx(\"good\");\n          makeFood();\n          // 提速\n        // 基础速度稍慢，随长度每 3 段降 5ms，最低 70ms/步\n        stepMs = Math.max(70, 195 - Math.floor(snake.length / 3) * 5);\n          restartStepTimer();\n          if (score > best) {\n            best = score;\n            MTG.saveScore(BEST_KEY, best);\n          }\n        } else {\n          snake.shift();\n        }\n        updateHud();\n        draw();\n      }\n\n      function startGame() {\n        resetGame();\n        state = \"running\";\n        document.getElementById(\"cover\").classList.add(\"hidden\");\n        pauseBtn.disabled = false;\n        pauseBtn.textContent = \"⏸ 暂停\";\n        updateHud();\n        startStepTimer();\n        MTG.sfx(\"click\");\n      }\n\n      function startStepTimer() {\n        stopStepTimer();\n        stepTimer = setInterval(step, stepMs);\n      }\n      function stopStepTimer() {\n        if (stepTimer) { clearInterval(stepTimer); stepTimer = null; }\n      }\n      function restartStepTimer() {\n        if (state === \"running\") startStepTimer();\n      }\n\n      function togglePause() {\n        if (state === \"running\") {\n          state = \"paused\";\n          stopStepTimer();\n          pauseBtn.textContent = \"▶ 继续\";\n          MTG.showToast(\"巡逻已暂停\", \"\");\n        } else if (state === \"paused\") {\n          state = \"running\";\n          pauseBtn.textContent = \"⏸ 暂停\";\n          startStepTimer();\n          MTG.showToast(\"继续巡逻\", \"good\");\n        }\n        updateHud();\n      }\n\n      function gameOver(message, isWin) {\n        state = \"over\";\n        stopStepTimer();\n        pauseBtn.disabled = true;\n        if (score > best) {\n          best = score;\n          MTG.saveScore(BEST_KEY, best);\n        }\n        draw();\n        document.getElementById(\"resultIcon\").textContent = isWin ? \"🎖️\" : \"💥\";\n        document.getElementById(\"resultTitle\").textContent = isWin ? \"任务完成\" : \"巡逻失败\";\n        document.getElementById(\"resultScore\").textContent = score;\n        document.getElementById(\"resultLength\").textContent = snake.length;\n        document.getElementById(\"resultFood\").textContent = foods;\n        document.getElementById(\"resultBest\").textContent = Math.max(best, score);\n        document.getElementById(\"resultBody\").textContent = message;\n        MTG.openModal(document.getElementById(\"resultMask\"));\n        MTG.sfx(isWin ? \"win\" : \"lose\");\n        updateHud();\n      }\n\n      function queueDir(d) {\n        if (state !== \"running\") return;\n        var last = dirQueue.length > 0 ? dirQueue[dirQueue.length - 1] : dir;\n        if ((last.x === -d.x && last.y === -d.y) || (d.x === last.x && d.y === last.y)) return;\n        if (dirQueue.length < 3) dirQueue.push(d);\n      }\n\n      startBtn.addEventListener(\"click\", startGame);\n      pauseBtn.addEventListener(\"click\", function () { MTG.sfx(\"click\"); togglePause(); });\n      document.getElementById(\"againBtn\").addEventListener(\"click\", function () {\n        window.location.reload();\n      });\n\n      var padBtns = document.querySelectorAll(\".dirpad .pad-btn\");\n      for (var i = 0; i < padBtns.length; i++) {\n        padBtns[i].addEventListener(\"pointerdown\", function (ev) {\n          ev.preventDefault();\n          var d = this.getAttribute(\"data-dir\");\n          var v = d === \"up\" ? { x: 0, y: -1 } : d === \"down\" ? { x: 0, y: 1 } : d === \"left\" ? { x: -1, y: 0 } : { x: 1, y: 0 };\n          queueDir(v);\n        });\n      }\n\n      document.addEventListener(\"keydown\", function (ev) {\n        var k = ev.key;\n        if ([\"ArrowLeft\", \"ArrowRight\", \"ArrowUp\", \"ArrowDown\", \" \"].indexOf(k) >= 0) ev.preventDefault();\n        if (k === \" \" || k === \"p\" || k === \"P\") { togglePause(); return; }\n        var d = null;\n        if (k === \"ArrowUp\" || k === \"w\" || k === \"W\") d = { x: 0, y: -1 };\n        if (k === \"ArrowDown\" || k === \"s\" || k === \"S\") d = { x: 0, y: 1 };\n        if (k === \"ArrowLeft\" || k === \"a\" || k === \"A\") d = { x: -1, y: 0 };\n        if (k === \"ArrowRight\" || k === \"d\" || k === \"D\") d = { x: 1, y: 0 };\n        if (d) queueDir(d);\n      });\n\n      var stage = document.getElementById(\"stage\");\n      var sx = 0, sy = 0, tracking = false;\n      stage.addEventListener(\"pointerdown\", function (ev) {\n        if (state === \"running\" || state === \"paused\") {\n          sx = ev.clientX; sy = ev.clientY; tracking = true;\n          try { stage.setPointerCapture(ev.pointerId); } catch (e) {}\n        }\n      });\n      stage.addEventListener(\"pointermove\", function (ev) {\n        if (!tracking) return;\n        var dx = ev.clientX - sx;\n        var dy = ev.clientY - sy;\n        if (Math.abs(dx) < 26 && Math.abs(dy) < 26) return;\n        tracking = false;\n        var d = null;\n        if (Math.abs(dx) > Math.abs(dy)) d = { x: dx > 0 ? 1 : -1, y: 0 };\n        else d = { x: 0, y: dy > 0 ? 1 : -1 };\n        queueDir(d);\n      });\n      stage.addEventListener(\"pointerup\", function () { tracking = false; });\n      stage.addEventListener(\"pointercancel\", function () { tracking = false; });\n\n      resetGame();\n      draw();\n    })();\n  <\/script>\n<script>\n(function () {\n  \"use strict\";\n  function goHome() {\n    try { if (window.parent && window.parent !== window) window.parent.postMessage({ mtgCmd: \"home\" }, \"*\"); } catch (e) {}\n  }\n  document.addEventListener(\"click\", function (ev) {\n    var n = ev.target;\n    while (n && n !== document && !(n.tagName && n.tagName.toLowerCase() === \"a\")) n = n.parentNode;\n    if (n && n.getAttribute && /(^|\\/)index\\.html(#.*)?$/i.test(n.getAttribute(\"href\") || \"\")) {\n      ev.preventDefault(); ev.stopPropagation(); goHome();\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n",
  "roundup": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n  <title>围捕敌特 - 军训小游戏</title>\n  <style>\n:root {\n  --green-900: #27360f;\n  --green-700: #3c4f1c;\n  --green-600: #4f6528;\n  --green-500: #6b8337;\n  --green-300: #a8b878;\n  --sand-300: #e7d9b4;\n  --sand-400: #d7c08d;\n  --cream: #fbf6e9;\n  --ink: #2b2a19;\n  --danger: #a63a2b;\n  --warn: #c07f13;\n  --ok: #3f7d32;\n  --radius: 14px;\n  --shadow: 0 8px 22px rgba(30, 40, 10, 0.28);\n  --shadow-sm: 0 3px 9px rgba(30, 40, 10, 0.2);\n}\n\n* { box-sizing: border-box; }\n\nhtml, body { margin: 0; padding: 0; }\n\nbody {\n  min-height: 100vh;\n  color: var(--ink);\n  font-family: \"Microsoft YaHei\", \"PingFang SC\", \"Segoe UI\", system-ui, sans-serif;\n  background-color: #46552a;\n  background-image:\n    radial-gradient(circle at 18% 22%, rgba(107, 131, 55, 0.85) 0 48px, transparent 48px),\n    radial-gradient(circle at 72% 70%, rgba(38, 54, 15, 0.75) 0 70px, transparent 70px),\n    radial-gradient(circle at 55% 28%, rgba(137, 154, 93, 0.5) 0 46px, transparent 46px),\n    radial-gradient(circle at 30% 82%, rgba(60, 79, 28, 0.9) 0 60px, transparent 60px),\n    linear-gradient(135deg, #3f4f25 0%, #55682f 55%, #39491f 100%);\n  line-height: 1.6;\n  -webkit-tap-highlight-color: transparent;\n}\n\nbutton { font-family: inherit; }\n\n.page {\n  width: 100%;\n  max-width: 1080px;\n  margin: 0 auto;\n  padding: 12px 12px 28px;\n}\n\n/* 顶部工具条 */\n.toolbar {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 12px;\n  background: rgba(43, 59, 22, 0.92);\n  border: 2px solid rgba(231, 217, 180, 0.35);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-sm);\n  color: var(--cream);\n}\n\n.toolbar h1 {\n  flex: 1;\n  margin: 0 8px;\n  font-size: 1.2rem;\n  letter-spacing: 2px;\n  text-align: center;\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  min-width: 48px;\n  min-height: 44px;\n  padding: 9px 16px;\n  border: 0;\n  border-radius: 10px;\n  font-size: 1rem;\n  font-weight: 700;\n  color: var(--cream);\n  background: linear-gradient(180deg, var(--green-500), var(--green-700));\n  box-shadow: 0 3px 0 var(--green-900), var(--shadow-sm);\n  cursor: pointer;\n  text-decoration: none;\n  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;\n  touch-action: manipulation;\n  user-select: none;\n  -webkit-user-select: none;\n}\n\n.btn:hover { filter: brightness(1.12); }\n.btn:active {\n  transform: translateY(2px);\n  box-shadow: 0 1px 0 var(--green-900);\n}\n\n.btn.ghost {\n  color: var(--green-900);\n  background: linear-gradient(180deg, var(--sand-300), var(--sand-400));\n  box-shadow: 0 3px 0 #9b8754;\n}\n\n.btn.warn {\n  background: linear-gradient(180deg, #c98325, #9a5d12);\n  box-shadow: 0 3px 0 #5f3a0a;\n}\n\n.btn:disabled {\n  filter: grayscale(0.75);\n  opacity: 0.55;\n  cursor: not-allowed;\n  transform: none;\n}\n\n.icon-btn {\n  width: 46px;\n  height: 46px;\n  min-width: 46px;\n  min-height: 46px;\n  padding: 0;\n  font-size: 1.25rem;\n  border-radius: 50%;\n}\n\n/* 通用面板 */\n.panel {\n  margin-top: 14px;\n  padding: 14px 16px;\n  border-radius: var(--radius);\n  background: var(--cream);\n  box-shadow: var(--shadow);\n  border: 1px solid rgba(88, 73, 33, 0.25);\n}\n\n.panel h2, .panel h3 {\n  margin: 0 0 6px;\n  color: var(--green-900);\n}\n\n.panel p { margin: 6px 0; }\n\n/* 状态栏 */\n.hud {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-top: 14px;\n  justify-content: center;\n}\n\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  padding: 7px 13px;\n  border-radius: 999px;\n  background: var(--cream);\n  border: 2px solid var(--sand-400);\n  box-shadow: var(--shadow-sm);\n  font-weight: 700;\n  white-space: nowrap;\n}\n\n.chip b { color: var(--green-700); font-size: 1.05em; }\n.chip.danger b { color: var(--danger); }\n.chip.ok b { color: var(--ok); }\n\n/* 主舞台 */\n.arena {\n  margin-top: 14px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 14px;\n}\n\n.stage-box {\n  width: 100%;\n  max-width: 860px;\n  border-radius: var(--radius);\n  background: var(--cream);\n  box-shadow: var(--shadow);\n  border: 1px solid rgba(88, 73, 33, 0.25);\n  overflow: hidden;\n}\n\n/* 弹窗 */\n.modal-mask {\n  position: fixed;\n  inset: 0;\n  z-index: 90;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 18px;\n  background: rgba(18, 25, 8, 0.68);\n  backdrop-filter: blur(2px);\n}\n\n.modal-card {\n  width: 100%;\n  max-width: 460px;\n  max-height: 86vh;\n  overflow: auto;\n  padding: 22px;\n  border-radius: 18px;\n  background:\n    linear-gradient(180deg, rgba(251, 246, 233, 0.97), rgba(235, 221, 186, 0.98));\n  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);\n  border: 3px solid var(--green-600);\n  text-align: center;\n  color: var(--ink);\n}\n\n.modal-card h2 {\n  margin: 0 0 8px;\n  font-size: 1.45rem;\n  color: var(--green-900);\n}\n\n.modal-card h2.big-icon { font-size: 2.6rem; }\n.modal-body { margin: 8px 0 16px; font-size: 1.02rem; }\n.modal-actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  justify-content: center;\n}\n.modal-actions .btn { min-width: 130px; }\n\n.stat-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 8px;\n  margin: 10px 0;\n}\n.stat-grid .stat {\n  padding: 9px 6px;\n  border-radius: 10px;\n  background: rgba(216, 194, 141, 0.35);\n  border: 1px solid rgba(120, 100, 45, 0.25);\n}\n.stat .label { font-size: 0.86rem; color: #665c3c; }\n.stat .value { font-size: 1.25rem; font-weight: 800; color: var(--green-900); }\n.stat .value.danger { color: var(--danger); }\n.stat .value.ok { color: var(--ok); }\n\n/* 轻提示 */\n.toast {\n  position: fixed;\n  left: 50%;\n  top: 16%;\n  z-index: 80;\n  transform: translateX(-50%);\n  padding: 10px 20px;\n  border-radius: 999px;\n  font-size: 1.05rem;\n  font-weight: 800;\n  color: #fff;\n  background: rgba(39, 54, 15, 0.92);\n  box-shadow: var(--shadow);\n  pointer-events: none;\n  text-align: center;\n  max-width: 88vw;\n  transition: opacity 0.25s ease;\n}\n.toast.hide { opacity: 0; }\n.toast.good { background: rgba(47, 103, 36, 0.94); }\n.toast.bad { background: rgba(160, 49, 35, 0.95); }\n\n/* 方向键区 */\n.dirpad {\n  display: grid;\n  grid-template-areas:\n    \". up .\"\n    \"left down right\";\n  grid-template-columns: repeat(3, 72px);\n  grid-template-rows: repeat(2, 72px);\n  gap: 8px;\n  justify-content: center;\n  margin: 4px auto;\n}\n\n.dirpad .pad-btn {\n  min-width: 64px;\n  min-height: 64px;\n  padding: 0;\n  border-radius: 12px;\n  font-size: 1.6rem;\n  background: linear-gradient(180deg, var(--green-500), var(--green-700));\n  color: #fff;\n  box-shadow: 0 4px 0 var(--green-900), var(--shadow-sm);\n  border: 0;\n  cursor: pointer;\n  touch-action: manipulation;\n  user-select: none;\n  -webkit-user-select: none;\n}\n.dirpad .pad-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-900); }\n.pad-up { grid-area: up; }\n.pad-down { grid-area: down; }\n.pad-left { grid-area: left; }\n.pad-right { grid-area: right; }\n\n/* 操作说明 */\n.help-box {\n  margin-top: 14px;\n  font-size: 0.94rem;\n  background: var(--cream);\n  color: var(--ink);\n}\n.help-box kbd {\n  display: inline-block;\n  padding: 1px 7px;\n  border-radius: 5px;\n  background: #e8e1cb;\n  border: 1px solid #b8a976;\n  box-shadow: 0 2px 0 #b3a66f;\n  font-size: 0.9em;\n  font-weight: 700;\n}\n\n/* 首页 */\n.hero {\n  margin-top: 16px;\n  padding: 26px 18px;\n  text-align: center;\n  color: var(--cream);\n}\n.hero h1 {\n  margin: 0 0 8px;\n  font-size: clamp(1.6rem, 5vw, 2.6rem);\n  letter-spacing: 8px;\n  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);\n}\n.hero p { margin: 0; font-size: 1rem; color: var(--sand-300); }\n\n.version-tag {\n  display: inline-block;\n  margin-left: 8px;\n  padding: 2px 10px;\n  border-radius: 999px;\n  background: var(--sand-400);\n  color: var(--green-900);\n  font-size: 0.8rem;\n  letter-spacing: 0;\n  vertical-align: 6px;\n}\n\n.cards {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\n  gap: 14px;\n  margin-top: 18px;\n}\n\n.card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  min-height: 168px;\n  padding: 18px;\n  border-radius: 16px;\n  color: var(--ink);\n  text-decoration: none;\n  background:\n    linear-gradient(155deg, rgba(251, 246, 233, 0.96) 0%, rgba(231, 217, 180, 0.96) 100%);\n  border: 2px solid rgba(105, 118, 58, 0.45);\n  box-shadow: var(--shadow-sm);\n  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;\n  overflow: hidden;\n}\n.card::after {\n  content: \"\";\n  position: absolute;\n  right: -28px;\n  bottom: -28px;\n  width: 100px;\n  height: 100px;\n  border-radius: 50%;\n  background: radial-gradient(circle, rgba(107, 131, 55, 0.35), transparent 70%);\n}\n.card:hover {\n  transform: translateY(-4px);\n  border-color: var(--green-500);\n  box-shadow: var(--shadow);\n}\n.card .num {\n  position: absolute;\n  top: 10px;\n  right: 12px;\n  font-size: 1.05rem;\n  font-weight: 800;\n  color: rgba(60, 79, 28, 0.45);\n}\n.card .icon { font-size: 2.4rem; line-height: 1; }\n.card h2 { margin: 0; font-size: 1.22rem; color: var(--green-900); }\n.card p { margin: 0; font-size: 0.92rem; flex: 1; }\n.card .foot {\n  font-size: 0.8rem;\n  color: #73693f;\n  border-top: 1px dashed rgba(115, 105, 63, 0.4);\n  padding-top: 7px;\n}\n\nfooter.note {\n  margin: 22px auto 4px;\n  text-align: center;\n  color: var(--sand-300);\n  font-size: 0.88rem;\n}\n\n.hidden { display: none !important; }\n\n/* 手机窄屏适配 */\n@media (max-width: 640px) {\n  .toolbar { gap: 5px; padding: 8px; }\n  .toolbar h1 { font-size: 1rem; letter-spacing: 1px; }\n  .icon-btn { width: 46px; height: 46px; min-width: 46px; min-height: 46px; }\n  .btn { padding: 9px 11px; }\n  .dirpad { grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    transition-duration: 0.01ms !important;\n  }\n}\n\n</style>\n  <style>\n    .roundup-wrap { width: 100%; max-width: 680px; }\n    .roundup-board {\n      display: grid;\n      grid-template-columns: repeat(11, 1fr);\n      gap: 4px;\n      width: 100%;\n      padding: 10px;\n      background: linear-gradient(160deg, #73844a, #5d6d37);\n      border-radius: 14px;\n      box-shadow: inset 0 0 0 3px #3f4d25, var(--shadow);\n    }\n    .gcell {\n      position: relative;\n      aspect-ratio: 1 / 1;\n      min-width: 0;\n      padding: 0;\n      border: 0;\n      border-radius: 7px;\n      background: #e7d8ae;\n      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.09);\n      font-size: clamp(0.72rem, 3.2vw, 1.05rem);\n      font-weight: 900;\n      color: #36461b;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      touch-action: manipulation;\n      cursor: pointer;\n      user-select: none;\n      -webkit-user-select: none;\n    }\n    .gcell.exit { background: linear-gradient(180deg, #f2d47c, #d9ac42); color: #6f4d08; }\n    .gcell.obstacle { background: repeating-linear-gradient(45deg, #5f4a2c 0 7px, #7a6140 7px 14px); box-shadow: inset 0 0 0 2px #3b2d19; color: #cbb588; }\n    .gcell.guard { background: linear-gradient(180deg, #4f842f, #35621d); color: #fff; box-shadow: 0 0 0 2px #1d3c0d; }\n    .gcell.spy {\n      background: linear-gradient(180deg, #d74d36, #a02e1d);\n      color: #fff;\n      box-shadow: 0 0 0 2px #fff, 0 0 10px rgba(217, 61, 39, 0.75);\n      z-index: 2;\n    }\n    .gcell.used { cursor: not-allowed; filter: brightness(0.92); }\n    .gcell.empty-active:hover { filter: brightness(1.08); }\n    .roundup-controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }\n    .hint-line {\n      display: flex;\n      gap: 10px;\n      align-items: center;\n      justify-content: center;\n      font-weight: 800;\n      margin: 4px 0 0;\n      min-height: 2em;\n    }\n    .hint-arrow {\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      width: 34px;\n      height: 34px;\n      border-radius: 50%;\n      background: var(--danger);\n      color: #fff;\n      font-size: 1.2rem;\n    }\n    @media (max-width: 460px) {\n      .roundup-board { gap: 2.5px; padding: 6px; border-radius: 10px; }\n      .gcell { border-radius: 4px; }\n    }\n  </style>\n</head>\n<body>\n  <header class=\"toolbar\">\n    <a class=\"btn ghost\" href=\"index.html\" aria-label=\"返回主页\">← 主页</a>\n    <h1>围捕敌特</h1>\n    <button class=\"icon-btn\" id=\"btnRestart\" type=\"button\" aria-label=\"重新开始\">↻</button>\n    <button class=\"icon-btn\" id=\"btnSound\" type=\"button\" aria-label=\"音效开关\">🔇</button>\n  </header>\n\n  <main class=\"page\">\n    <section class=\"hud\" aria-label=\"游戏状态\">\n      <span class=\"chip\">回合 <b id=\"roundNum\">0</b></span>\n      <span class=\"chip\">剩余哨卡 <b id=\"guardsLeft\">20</b></span>\n      <span class=\"chip\" id=\"stateChip\">状态 <b>追捕中</b></span>\n      <span class=\"chip danger\">敌特下一步 <b id=\"hintDir\">-</b></span>\n    </section>\n\n    <section class=\"arena roundup-wrap\">\n      <div class=\"panel roundup-controls\" id=\"startPanel\">\n        <p style=\"width:100%;text-align:center;margin:0\"><strong>敌特被困在 11×11 边境营地，四个角落是唯一出口</strong></p>\n        <button class=\"btn\" id=\"btnStart\" type=\"button\">▶ 开始围捕</button>\n      </div>\n      <div class=\"roundup-board hidden\" id=\"board\" aria-label=\"营地网格\"></div>\n      <p class=\"hint-line hidden\" id=\"hintLine\"><span>逃跑意图：</span><span class=\"hint-arrow\" id=\"hintArrow\">-</span></p>\n    </section>\n\n    <section class=\"panel help-box\">\n      <h3>玩法与规则</h3>\n      <p>你的巡逻队每回合可在任意空格放 1 个哨卡，随后敌特会沿最短路径朝最近的<strong>出口（金色四角）</strong>移动 1 格。</p>\n      <p>先封住出口缺口，再逐步围拢：把敌特四邻全部封死即捕获成功；敌特踩上出口或被哨卡耗尽逼出缺口则任务失败。鼠标 / 手指点按空格即可布哨。</p>\n      <p>若四个出口全部被封，敌特不会原地等待，而会在剩余通路中四处游走，围捕时要注意封堵它的下一步。</p>\n      <p>深棕斜纹为壕沟，无法通行；敌特所在格不能放哨卡。</p>\n    </section>\n  </main>\n\n  <div class=\"modal-mask hidden\" id=\"resultMask\">\n    <section class=\"modal-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"resultTitle\">\n      <h2 class=\"big-icon\" id=\"resultIcon\">🎯</h2>\n      <h2 id=\"resultTitle\">任务完成</h2>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"label\">使用回合</div><div class=\"value\" id=\"resultRounds\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">消耗哨卡</div><div class=\"value\" id=\"resultUsed\">0</div></div>\n        <div class=\"stat\"><div class=\"label\">剩余哨卡</div><div class=\"value\" id=\"resultLeft\">0</div></div>\n      </div>\n      <div class=\"modal-body\" id=\"resultBody\"></div>\n      <div class=\"modal-actions\">\n        <button class=\"btn\" id=\"againBtn\" type=\"button\">再抓一次</button>\n        <a class=\"btn ghost\" href=\"index.html\">返回主页</a>\n      </div>\n    </section>\n  </div>\n\n  <script>\n/* 公共辅助：音效开关、音效生成、最高分读写、通用轻提示 */\n(function () {\n  \"use strict\";\n\n  var STORAGE_KEY = \"mtg_sound_on\";\n  var soundOn = false;\n  var audioCtx = null;\n\n  // 兼容 file:// 下 localStorage 不可用的情况\n  function storageGet(key) {\n    try {\n      return window.localStorage.getItem(key);\n    } catch (e) {\n      return null;\n    }\n  }\n\n  function storageSet(key, value) {\n    try {\n      window.localStorage.setItem(key, value);\n    } catch (e) {\n      /* 忽略：隐私模式或 file:// 限制时仅本次会话有效 */\n    }\n  }\n\n  function ensureCtx() {\n    if (!audioCtx) {\n      var AC = window.AudioContext || window.webkitAudioContext;\n      if (AC) {\n        audioCtx = new AC();\n      }\n    }\n    if (audioCtx && audioCtx.state === \"suspended\") {\n      audioCtx.resume();\n    }\n    return audioCtx;\n  }\n\n  function tone(freq, dur, when, type, volume) {\n    var ctx = audioCtx;\n    if (!ctx) return;\n    var t0 = ctx.currentTime + (when || 0);\n    var osc = ctx.createOscillator();\n    var gain = ctx.createGain();\n    osc.type = type || \"square\";\n    osc.frequency.setValueAtTime(freq, t0);\n    gain.gain.setValueAtTime(0.0001, t0);\n    gain.gain.exponentialRampToValueAtTime(volume || 0.12, t0 + 0.012);\n    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n    osc.connect(gain);\n    gain.connect(ctx.destination);\n    osc.start(t0);\n    osc.stop(t0 + dur + 0.04);\n  }\n\n  function sfx(kind) {\n    if (!soundOn || !ensureCtx()) return;\n    switch (kind) {\n      case \"click\": tone(480, 0.07, 0, \"square\", 0.08); break;\n      case \"good\": tone(660, 0.08, 0); tone(880, 0.1, 0.09); break;\n      case \"bad\": tone(180, 0.22, 0, \"sawtooth\", 0.11); break;\n      case \"flip\": tone(700, 0.05, 0, \"triangle\", 0.08); break;\n      case \"tick\": tone(1000, 0.04, 0, \"square\", 0.05); break;\n      case \"win\":\n        tone(523, 0.1, 0);\n        tone(659, 0.1, 0.12);\n        tone(784, 0.18, 0.24);\n        break;\n      case \"lose\":\n        tone(392, 0.16, 0);\n        tone(311, 0.16, 0.16);\n        tone(233, 0.3, 0.32);\n        break;\n      case \"throw\": tone(300, 0.25, 0, \"sawtooth\", 0.07); break;\n      case \"boom\": tone(120, 0.32, 0, \"sawtooth\", 0.16); break;\n      case \"step\": tone(520, 0.05, 0, \"triangle\", 0.06); break;\n      default: tone(440, 0.08, 0);\n    }\n  }\n\n  function setSound(on, persist) {\n    soundOn = !!on;\n    var btn = document.getElementById(\"btnSound\");\n    if (btn) {\n      btn.textContent = soundOn ? \"🔊\" : \"🔇\";\n      btn.title = soundOn ? \"音效：开（点击关闭）\" : \"音效：关（点击开启）\";\n      btn.setAttribute(\"aria-pressed\", soundOn ? \"true\" : \"false\");\n    }\n    if (persist !== false) storageSet(STORAGE_KEY, soundOn ? \"1\" : \"0\");\n  }\n\n  function toggleSound() {\n    setSound(!soundOn);\n    if (soundOn) {\n      ensureCtx();\n      sfx(\"click\");\n    }\n    return soundOn;\n  }\n\n  function bindSoundBtn() {\n    var btn = document.getElementById(\"btnSound\");\n    if (btn) {\n      btn.addEventListener(\"click\", function (ev) {\n        ev.stopPropagation();\n        toggleSound();\n      });\n    }\n    soundOn = storageGet(STORAGE_KEY) === \"1\"; // 音效总开关，默认关闭\n    setSound(soundOn, false);\n  }\n\n  function getScore(key, fallback) {\n    var raw = storageGet(key);\n    if (raw === null || raw === \"\") return fallback;\n    var n = Number(raw);\n    return isFinite(n) ? n : fallback;\n  }\n\n  function saveScore(key, value) {\n    storageSet(key, String(value));\n  }\n\n  // 浮动提示，自动消失\n  var toastTimer = null;\n  function showToast(text, kind) {\n    var old = document.querySelector(\".toast\");\n    if (old) old.remove();\n    var el = document.createElement(\"div\");\n    el.className = \"toast\" + (kind ? \" \" + kind : \"\");\n    el.setAttribute(\"role\", \"status\");\n    el.textContent = text;\n    document.body.appendChild(el);\n    if (toastTimer) clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () {\n      el.classList.add(\"hide\");\n      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);\n    }, 1300);\n  }\n\n  // 页面初始化：绑定音效按钮，并给“重新开始”按钮绑定重载\n  function initPage() {\n    bindSoundBtn();\n    var restartBtn = document.getElementById(\"btnRestart\");\n    if (restartBtn) {\n      restartBtn.title = \"重新开始\";\n      restartBtn.addEventListener(\"click\", function () {\n        sfx(\"click\");\n        window.location.reload();\n      });\n    }\n    // 给所有关闭弹窗的通用按钮绑定事件（data-close-modal）\n    var closers = document.querySelectorAll(\"[data-close-modal]\");\n    for (var i = 0; i < closers.length; i++) {\n      closers[i].addEventListener(\"click\", function () {\n        var mask = document.querySelector(\".modal-mask:not(.hidden)\");\n        if (mask) mask.classList.add(\"hidden\");\n      });\n    }\n  }\n\n  function openModal(maskEl) {\n    if (maskEl) maskEl.classList.remove(\"hidden\");\n  }\n\n  function closeModal(maskEl) {\n    if (maskEl) maskEl.classList.add(\"hidden\");\n  }\n\n  // 暴露到全局\n  window.MTG = {\n    sfx: sfx,\n    setSound: setSound,\n    toggleSound: toggleSound,\n    getScore: getScore,\n    saveScore: saveScore,\n    showToast: showToast,\n    initPage: initPage,\n    openModal: openModal,\n    closeModal: closeModal\n  };\n})();\n\n<\/script>\n  <script>\n    (function () {\n      \"use strict\";\n      MTG.initPage();\n\n      var N = 11;\n      var CENTER = { r: 5, c: 5 };\n      var EXITS = [{ r: 0, c: 0 }, { r: 0, c: N - 1 }, { r: N - 1, c: 0 }, { r: N - 1, c: N - 1 }];\n      var GUARD_TOTAL = 20;\n      var NEIGHBORS = [\n        { r: -1, c: 0, label: \"上 ↑\" },\n        { r: 0, c: 1, label: \"右 →\" },\n        { r: 1, c: 0, label: \"下 ↓\" },\n        { r: 0, c: -1, label: \"左 ←\" }\n      ];\n\n      var state = \"idle\";       // idle / playing / captured / escaped / exhausted\n      var spy = { r: CENTER.r, c: CENTER.c };\n      var prevSpy = null;       // 敌特上一格，用于无出口时游走不原路折返\n      var guardsUsed = 0;\n      var grid = [];            // \"open\" | \"guard\" | \"wall\"\n      var boardEl = document.getElementById(\"board\");\n      var startPanel = document.getElementById(\"startPanel\");\n\n      var roundEl = document.getElementById(\"roundNum\");\n      var guardsLeftEl = document.getElementById(\"guardsLeft\");\n      var hintEl = document.getElementById(\"hintDir\");\n      var hintArrow = document.getElementById(\"hintArrow\");\n      var hintLine = document.getElementById(\"hintLine\");\n\n      function key(r, c) { return r * N + c; }\n      function isExit(r, c) {\n        for (var i = 0; i < EXITS.length; i++) {\n          if (EXITS[i].r === r && EXITS[i].c === c) return true;\n        }\n        return false;\n      }\n\n      function makeGrid() {\n        grid = [];\n        for (var r = 0; r < N; r++) {\n          grid.push([]);\n          for (var c = 0; c < N; c++) {\n            grid[r].push(\"open\");\n          }\n        }\n        // 随机内部壕沟（不占边界、出生区与出口）\n        var count = 0;\n        var guard = 0;\n        while (count < 6 && guard < 600) {\n          guard++;\n          var r = 1 + Math.floor(Math.random() * (N - 2));\n          var c = 1 + Math.floor(Math.random() * (N - 2));\n          if (Math.abs(r - CENTER.r) + Math.abs(c - CENTER.c) <= 3) continue;\n          if (grid[r][c] === \"open\") { grid[r][c] = \"wall\"; count++; }\n        }\n      }\n\n      function findNextMove() {\n        // 选择仍然开放的出口（出口本身不能被哨卡占）\n        var openExits = [];\n        for (var i = 0; i < EXITS.length; i++) {\n          var e = EXITS[i];\n          if (grid[e.r][e.c] === \"open\") openExits.push(e);\n        }\n        if (openExits.length === 0) return null;\n\n        // BFS：求最短路径的第一步\n        var startK = key(spy.r, spy.c);\n        var prev = {};\n        var dist = {};\n        var queue = [startK];\n        dist[startK] = 0;\n        var foundExit = null;\n        var qi = 0;\n        while (qi < queue.length && !foundExit) {\n          var k = queue[qi++];\n          var r = Math.floor(k / N), c = k % N;\n          for (var ni = 0; ni < NEIGHBORS.length && !foundExit; ni++) {\n            var nr = r + NEIGHBORS[ni].r, nc = c + NEIGHBORS[ni].c;\n            if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;\n            if (grid[nr][nc] !== \"open\") continue;\n            var nk = key(nr, nc);\n            if (dist[nk] !== undefined) continue;\n            dist[nk] = dist[k] + 1;\n            prev[nk] = k;\n            for (var ei = 0; ei < openExits.length; ei++) {\n              if (openExits[ei].r === nr && openExits[ei].c === nc) { foundExit = nk; break; }\n            }\n            if (!foundExit) queue.push(nk);\n          }\n        }\n        if (!foundExit) return null;\n        // 回溯到紧邻敌特的下一步\n        var cur = foundExit;\n        while (prev[cur] !== startK && prev[cur] !== undefined) cur = prev[cur];\n        return { r: Math.floor(cur / N), c: cur % N };\n      }\n\n      // 出口被封后：在可通行的相邻格中挑一个继续游走\n      function wanderTarget() {\n        var options = [];\n        for (var i = 0; i < NEIGHBORS.length; i++) {\n          var nr = spy.r + NEIGHBORS[i].r;\n          var nc = spy.c + NEIGHBORS[i].c;\n          if (nr >= 0 && nr < N && nc >= 0 && nc < N && grid[nr][nc] === \"open\") {\n            options.push({ r: nr, c: nc });\n          }\n        }\n        if (options.length === 0) return null;\n        // 尽量不原路折返\n        var noBack = [];\n        for (var j = 0; j < options.length; j++) {\n          if (!prevSpy || options[j].r !== prevSpy.r || options[j].c !== prevSpy.c) {\n            noBack.push(options[j]);\n          }\n        }\n        var pool = noBack.length > 0 ? noBack : options;\n        // 延续上一次移动方向，其次按 上/右/下/左 选第一个可走的\n        if (prevSpy) {\n          var dr = spy.r - prevSpy.r;\n          var dc = spy.c - prevSpy.c;\n          for (var k = 0; k < pool.length; k++) {\n            if (pool[k].r - spy.r === dr && pool[k].c - spy.c === dc) {\n              return pool[k];\n            }\n          }\n        }\n        return pool[0];\n      }\n\n      function nextMoveLabel(move) {\n        if (!move) return { arrow: \"⛔\", text: \"无路可逃\" };\n        var dr = move.r - spy.r, dc = move.c - spy.c;\n        if (dr === -1) return { arrow: \"↑\", text: \"上\" };\n        if (dr === 1) return { arrow: \"↓\", text: \"下\" };\n        if (dc === -1) return { arrow: \"←\", text: \"左\" };\n        return { arrow: \"→\", text: \"右\" };\n      }\n\n      function paintBoard() {\n        boardEl.innerHTML = \"\";\n        for (var r = 0; r < N; r++) {\n          for (var c = 0; c < N; c++) {\n            var cell = document.createElement(\"button\");\n            cell.type = \"button\";\n            cell.dataset.r = r;\n            cell.dataset.c = c;\n            cell.className = \"gcell\";\n            if (isExit(r, c)) cell.classList.add(\"exit\");\n            if (grid[r][c] === \"wall\") {\n              cell.classList.add(\"obstacle\");\n              cell.textContent = \"壕\";\n            } else if (grid[r][c] === \"guard\") {\n              cell.classList.add(\"guard\");\n              cell.textContent = \"哨\";\n            } else {\n              cell.classList.add(\"empty-active\");\n            }\n            if (r === spy.r && c === spy.c) {\n              cell.classList.add(\"spy\");\n              cell.textContent = \"特\";\n            }\n            if (isExit(r, c) && grid[r][c] !== \"guard\") {\n              cell.textContent = \"口\";\n            }\n            if (isExit(r, c) && grid[r][c] === \"guard\") cell.textContent = \"哨\";\n            cell.addEventListener(\"click\", (function (rr, cc) { return function () { onPlace(rr, cc); }; })(r, c));\n            boardEl.appendChild(cell);\n          }\n        }\n        if (isExit(spy.r, spy.c)) {\n          // 理论上到达出口就应已判负，此处兜底\n          boardEl.children[key(spy.r, spy.c)].textContent = \"特\";\n        }\n      }\n\n      function updateHud(status) {\n        roundEl.textContent = guardsUsed;\n        guardsLeftEl.textContent = Math.max(0, GUARD_TOTAL - guardsUsed);\n        var stateChip = document.getElementById(\"stateChip\");\n        var text = state === \"captured\" ? \"已捕获\" : state === \"escaped\" ? \"已逃脱\" : state === \"exhausted\" ? \"哨卡用尽\" : \"追捕中\";\n        stateChip.innerHTML = \"状态 <b>\" + text + \"</b>\";\n        var next = findNextMove();\n        var shown = next;\n        var wandering = false;\n        if (!shown) {\n          var roam = wanderTarget();\n          if (roam) {\n            shown = roam;\n            wandering = true;\n          }\n        }\n        var label = shown ? nextMoveLabel(shown) : { arrow: \"⛔\", text: \"原地不动\" };\n        if (wandering) label.text = \"游走\" + label.text;\n        hintEl.textContent = label.text;\n        hintArrow.textContent = label.arrow;\n        hintLine.classList.toggle(\"hidden\", state === \"captured\" || state === \"escaped\");\n        if (state === \"playing\" && next === null) {\n          var sc = document.getElementById(\"stateChip\");\n          sc.innerHTML = \"状态 <b>出口已封·游走中</b>\";\n        }\n      }\n\n      function startGame() {\n        state = \"playing\";\n        spy = { r: CENTER.r, c: CENTER.c };\n        prevSpy = null;\n        guardsUsed = 0;\n        makeGrid();\n        startPanel.classList.add(\"hidden\");\n        boardEl.classList.remove(\"hidden\");\n        paintBoard();\n        updateHud();\n        MTG.showToast(\"围捕开始：先封金色出口！\", \"\");\n        MTG.sfx(\"click\");\n      }\n\n      function finish(message, win) {\n        state = win ? \"captured\" : \"escaped\";\n        if (!win && guardsUsed >= GUARD_TOTAL) state = \"exhausted\";\n        document.getElementById(\"resultIcon\").textContent = win ? \"🎖️\" : state === \"exhausted\" ? \"🏳️\" : \"🏃\";\n        document.getElementById(\"resultTitle\").textContent =\n          win ? \"任务完成：敌特已被包围\" : state === \"exhausted\" ? \"任务失败：哨卡耗尽\" : \"任务失败：敌特逃脱\";\n        document.getElementById(\"resultRounds\").textContent = guardsUsed;\n        document.getElementById(\"resultUsed\").textContent = guardsUsed;\n        document.getElementById(\"resultLeft\").textContent = Math.max(0, GUARD_TOTAL - guardsUsed);\n        document.getElementById(\"resultBody\").textContent = message;\n        updateHud();\n        MTG.openModal(document.getElementById(\"resultMask\"));\n        MTG.sfx(win ? \"win\" : \"lose\");\n      }\n\n      function onPlace(r, c) {\n        if (state !== \"playing\") return;\n        if (r === spy.r && c === spy.c) {\n          MTG.showToast(\"不能把哨卡放在敌特脚下\", \"bad\");\n          MTG.sfx(\"bad\");\n          return;\n        }\n        if (grid[r][c] !== \"open\") {\n          MTG.showToast(\"这里已被占用\", \"bad\");\n          MTG.sfx(\"bad\");\n          return;\n        }\n        if (guardsUsed >= GUARD_TOTAL) {\n          finish(\"增援哨卡全部用尽，包围圈出现缺口，围捕行动失败。\", false);\n          return;\n        }\n        grid[r][c] = \"guard\";\n        guardsUsed += 1;\n        MTG.sfx(\"flip\");\n\n        // 判断是否完全围死\n        var blockedNeighbors = 0;\n        for (var i = 0; i < NEIGHBORS.length; i++) {\n          var nr = spy.r + NEIGHBORS[i].r, nc = spy.c + NEIGHBORS[i].c;\n          if (nr < 0 || nr >= N || nc < 0 || nc >= N || grid[nr][nc] !== \"open\") blockedNeighbors++;\n          else if (nr === r && nc === c) blockedNeighbors++;\n        }\n        if (blockedNeighbors >= 4) {\n          paintBoard();\n          updateHud();\n          finish(\"敌特四面都被哨卡封死，无路可走，成功捕获！\", true);\n          return;\n        }\n\n        // 敌特移动一步：有出口可逃则沿最短路径逃跑\n        var oldSpy = { r: spy.r, c: spy.c };\n        var move = findNextMove();\n        if (move) {\n          var destIsExit = isExit(move.r, move.c);\n          spy = { r: move.r, c: move.c };\n          prevSpy = oldSpy;\n        } else {\n          // 出口全部被封：敌特不会停下，继续在剩余通路游走\n          var roam = wanderTarget();\n          if (!roam) {\n            paintBoard();\n            updateHud();\n            finish(\"敌特四周所有通路均被哨卡封死，成功捕获！\", true);\n            return;\n          }\n          spy = { r: roam.r, c: roam.c };\n          prevSpy = oldSpy;\n          MTG.showToast(\"出口已封，敌特开始四处游走！\", \"bad\");\n        }\n        paintBoard();\n        updateHud();\n        if (move && isExit(spy.r, spy.c)) {\n          finish(\"敌特从营地出口溜走，任务失败。下次记得提前把金色缺口封住。\", false);\n          return;\n        }\n        if (guardsUsed >= GUARD_TOTAL) {\n          // 哨卡刚好在敌特移动后用完\n          finish(\"增援哨卡已用完，包围圈无法继续收紧，敌特最终脱逃。\", false);\n          return;\n        }\n      }\n\n      document.getElementById(\"btnStart\").addEventListener(\"click\", startGame);\n      document.getElementById(\"againBtn\").addEventListener(\"click\", function () {\n        window.location.reload();\n      });\n    })();\n  <\/script>\n<script>\n(function () {\n  \"use strict\";\n  function goHome() {\n    try { if (window.parent && window.parent !== window) window.parent.postMessage({ mtgCmd: \"home\" }, \"*\"); } catch (e) {}\n  }\n  document.addEventListener(\"click\", function (ev) {\n    var n = ev.target;\n    while (n && n !== document && !(n.tagName && n.tagName.toLowerCase() === \"a\")) n = n.parentNode;\n    if (n && n.getAttribute && /(^|\\/)index\\.html(#.*)?$/i.test(n.getAttribute(\"href\") || \"\")) {\n      ev.preventDefault(); ev.stopPropagation(); goHome();\n    }\n  }, true);\n})();\n<\/script>\n</body>\n</html>\n"
  };
  var frame = document.getElementById("gameFrame");
  var active = null;

  function openGame(key) {
    if (!GAME_PAGES[key]) return;
    active = key;
    frame.removeAttribute("srcdoc");
    frame.setAttribute("srcdoc", GAME_PAGES[key]);
    document.getElementById("viewHome").classList.add("hidden");
    document.getElementById("viewGame").classList.remove("hidden");
  }

  function goHome() {
    active = null;
    frame.removeAttribute("srcdoc");
    frame.setAttribute("srcdoc", "");
    document.getElementById("viewGame").classList.add("hidden");
    document.getElementById("viewHome").classList.remove("hidden");
  }

  var cardList = document.querySelectorAll(".cards .card[data-game]");
  for (var i = 0; i < cardList.length; i++) {
    cardList[i].addEventListener("click", function () {
      openGame(this.getAttribute("data-game"));
    });
  }

  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.mtgCmd === "home") goHome();
  });
})();
  </script>
</body>
</html>
